<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGENDARY MINECRAFT SKIN FORGE - ULTIMATE</title>
    <style>
        :root {
            --bg-void: #030305;
            --panel-bg: #0b0a10;
            --panel-border: #1f1c30;
            --panel-border-glow: #3f3868;
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.4);
            --neon-purple: #8b5cf6;
            --neon-cyan: #06b6d4;
            --neon-pink: #ec4899;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Cinzel', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-void);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(245, 158, 11, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.04) 0%, transparent 60%);
        }

        /* Эпическая шапка с бейджами и быстрыми функциями */
        header {
            height: 70px;
            background: rgba(11, 10, 16, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            z-index: 20;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-title {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--gold-glow);
            text-transform: uppercase;
        }

        .badge-pill {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid var(--neon-purple);
            color: #d8b4fe;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .top-action-btn {
            background: #171526;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-action-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-1px);
        }

        .top-action-btn.random {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(139, 92, 246, 0.2));
            border-color: var(--neon-pink);
        }

        /* Рабочая область */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 440px 1fr;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        /* Левая панель арсенала */
        .arsenal-panel {
            background: rgba(11, 10, 16, 0.98);
            border-right: 2px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            z-index: 5;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            font-weight: 800;
        }

        .layer-counter {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: #171526;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
        }

        /* Вкладки категорий со стильными плашками */
        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .tabs-container::-webkit-scrollbar {
            height: 4px;
        }
        .tabs-container::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 2px;
        }

        .tab-btn {
            background: #141220;
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .tab-btn:hover {
            border-color: var(--panel-border-glow);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(99, 102, 241, 0.25));
            color: #fff;
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .tab-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--panel-border);
            margin-top: 2px;
        }

        .tab-btn.has-selection .tab-status-dot {
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
        }

        /* Сетка элементов */
        .grid-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .grid-container::-webkit-scrollbar {
            width: 6px;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 3px;
        }

        .grid-card {
            background: #100e18;
            border: 2px solid var(--panel-border);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .grid-card:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.15);
        }

        .grid-card.selected {
            border-color: var(--gold);
            background: linear-gradient(135deg, #221c2e, #141120);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .grid-card canvas {
            width: 76px;
            height: 76px;
            background: #060508;
            border-radius: 10px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 1px solid var(--panel-border);
        }

        .grid-card span {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .grid-card.selected span {
            color: var(--gold);
        }

        .card-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.6rem;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
        }
        .grid-card.selected .card-badge {
            background: var(--gold);
            color: #030305;
            border-color: var(--gold);
            font-weight: 800;
        }

        /* Правая зона вьювера и пафосного управления */
        .viewport-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #110e1d 0%, #030305 100%);
            padding: 20px;
            overflow: hidden;
        }

        #skin_container {
            width: 100%;
            height: 100%;
            max-width: 700px;
            max-height: 700px;
            cursor: grab;
            filter: drop-shadow(0 25px 50px rgba(0,0,0,0.9));
        }
        #skin_container:active {
            cursor: grabbing;
        }

        /* Плавающие панели управления / Доки */
        .control-dock {
            position: absolute;
            bottom: 25px;
            display: flex;
            gap: 12px;
            background: rgba(11, 10, 16, 0.9);
            backdrop-filter: blur(16px);
            border: 2px solid var(--panel-border);
            padding: 14px 20px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            z-index: 10;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .epic-btn {
            background: #151322;
            color: var(--text-main);
            border: 2px solid var(--panel-border);
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .epic-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.2);
        }

        .epic-btn.active-mode {
            background: var(--gold);
            color: #030305;
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .epic-btn.primary {
            background: linear-gradient(135deg, var(--gold), #d97706);
            color: #030305;
            border-color: transparent;
            font-size: 0.9rem;
            padding: 12px 24px;
            box-shadow: 0 0 25px var(--gold-glow);
        }
        .epic-btn.primary:hover {
            filter: brightness(1.15);
            color: #030305;
        }

        .divider {
            width: 2px;
            height: 30px;
            background: var(--panel-border);
            margin: 0 4px;
        }

        /* Дополнительные плашки состояния освещения / HUD в углу */
        .hud-overlay {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .hud-badge {
            background: rgba(11, 10, 16, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hud-badge:hover {
            border-color: var(--neon-cyan);
            color: var(--text-main);
        }
        .hud-badge span.dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-title">⚡ Minecraft Skin Forge</div>
            <div class="badge-pill"><span>✨</span> Ultimate Edition</div>
        </div>
        <div class="header-actions">
            <button class="top-action-btn random" onclick="randomizeSkin()">🎲 Случайный скин</button>
            <button class="top-action-btn" onclick="resetSkin()">🗑️ Очистить всё</button>
        </div>
    </header>

    <div class="workspace">
        <!-- Левая панель -->
        <div class="arsenal-panel">
            <div>
                <div class="section-header">
                    <div class="section-title">Категории слоев</div>
                    <div class="layer-counter" id="activeLayersCount">0/8 активно</div>
                </div>
                <div class="tabs-container" id="tabsContainer"></div>
            </div>
            
            <div style="flex:1; display: flex; flex-direction: column; overflow: hidden;">
                <div class="section-header">
                    <div class="section-title" id="activeCategoryTitle">Варианты</div>
                </div>
                <div class="grid-container" id="gridContainer"></div>
            </div>
        </div>

        <!-- Правая зона: 3D Вьювер и Эпический HUD -->
        <div class="viewport-section">
            <div class="hud-overlay">
                <div class="hud-badge" onclick="cycleLighting()"><span class="dot" id="lightDot"></span> Свет: <span id="lightModeName">Студийный</span></div>
                <div class="hud-badge" onclick="toggleCameraFOV()">🔭 FOV: <span id="fovValue">50°</span></div>
            </div>

            <canvas id="skin_container"></canvas>

            <div class="control-dock">
                <div class="control-group">
                    <button class="epic-btn active-mode" id="animToggle" onclick="cycleAnimation()">🚶 Ходьба</button>
                    <button class="epic-btn active-mode" id="rotToggle" onclick="toggleRotation()">🔄 Вращение</button>
                </div>
                <div class="divider"></div>
                <div class="control-group">
                    <button class="epic-btn" id="armToggle" onclick="toggleArmThickness()">💪 Руки: Стандарт</button>
                </div>
                <div class="divider"></div>
                <button class="epic-btn primary" onclick="downloadSkin()">📥 Извлечь скин</button>
            </div>
        </div>
    </div>

    <!-- Скрытый холст для сборки текстуры 64x64 -->
    <canvas id="hiddenCanvas" width="64" height="64" style="display:none;"></canvas>

    <script type="module">
        import * as skinview3d from 'https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/+esm';

        const layersConfig = [
            { id: 'skin', label: 'Кожа', path: 'skinmake/skin', options: ['1', '2', '3'] },
            { id: 'eyes', label: 'Глаза', path: 'skinmake/head/eyes', options: ['none', '1', '2', '3'] },
            { id: 'nose', label: 'Нос', path: 'skinmake/head/nose', options: ['none', '1', '2'] },
            { id: 'mouth', label: 'Рот', path: 'skinmake/head/mouth', options: ['none', '1', '2'] },
            { id: 'mustache', label: 'Усы', path: 'skinmake/head/mustache', options: ['none', '1', '2'] },
            { id: 'hair', label: 'Прическа', path: 'skinmake/head/hair', options: ['none', '1', '2', '3'] },
            { id: 'hair2', label: 'Прическа 2', path: 'skinmake/head/hair2', options: ['none', '1', '2'] },
            { id: 'jacket', label: 'Куртка', path: 'skinmake/body/jacket', options: ['none', '1', '2', '3'] }
        ];

        const state = {};
        let activeTab = 'skin';
        let skinViewer = null;
        let animMode = 1; // 0: Стоп, 1: Ходьба, 2: Бег
        let isRotating = true;
        let isSlimArms = false;
        let lightingPreset = 0; // 0: Студийный, 1: Неон, 2: Мрачный Воид
        let currentFov = 50;

        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');

        function initViewer() {
            const container = document.getElementById('skin_container');
            skinViewer = new skinview3d.SkinViewer({
                canvas: container,
                width: container.clientWidth || 600,
                height: container.clientHeight || 600,
                skin: null
            });

            skinViewer.autoRotate = true;
            skinViewer.autoRotateSpeed = 1.2;
            skinViewer.animation = new skinview3d.WalkingAnimation();
            skinViewer.animation.speed = 0.4;
            skinViewer.globalLight.intensity = 1.3;
            skinViewer.cameraLight.intensity = 0.5;
            skinViewer.fov = currentFov;

            window.addEventListener('resize', () => {
                skinViewer.width = container.clientWidth;
                skinViewer.height = container.clientHeight;
            });
        }

        function initUI() {
            layersConfig.forEach(layer => {
                state[layer.id] = layer.options[0];
            });

            renderTabs();
            renderGrid();
            updateActiveLayersCount();
        }

        function updateActiveLayersCount() {
            let activeCount = 0;
            layersConfig.forEach(l => {
                if (state[l.id] !== 'none' && l.id !== 'skin') activeCount++;
            });
            document.getElementById('activeLayersCount').innerText = `${activeCount}/7 доп. слоев`;
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';

            layersConfig.forEach(layer => {
                const btn = document.createElement('button');
                const hasSel = state[layer.id] !== 'none';
                btn.className = `tab-btn ${activeTab === layer.id ? 'active' : ''} ${hasSel ? 'has-selection' : ''}`;
                
                btn.innerHTML = `
                    <span>${layer.label}</span>
                    <span class="tab-status-dot"></span>
                `;

                btn.onclick = () => {
                    activeTab = layer.id;
                    document.getElementById('activeCategoryTitle').innerText = `Варианты: ${layer.label}`;
                    renderTabs();
                    renderGrid();
                };
                tabsContainer.appendChild(btn);
            });
            document.getElementById('activeCategoryTitle').innerText = `Варианты: ${layersConfig.find(l => l.id === activeTab).label}`;
        }

        async function renderGrid() {
            const gridContainer = document.getElementById('gridContainer');
            gridContainer.innerHTML = '';

            const currentLayer = layersConfig.find(l => l.id === activeTab);
            if (!currentLayer) return;

            for (const opt of currentLayer.options) {
                const isSelected = state[activeTab] === opt;
                const card = document.createElement('div');
                card.className = `grid-card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => {
                    state[activeTab] = opt;
                    updateSkin();
                    renderTabs();
                    renderGrid();
                    updateActiveLayersCount();
                };

                const cardCanvas = document.createElement('canvas');
                cardCanvas.width = 64;
                cardCanvas.height = 64;

                const span = document.createElement('span');
                span.innerText = opt === 'none' ? 'ПУСТО' : `СТИЛЬ #${opt}`;

                const badge = document.createElement('div');
                badge.className = 'card-badge';
                badge.innerText = isSelected ? 'АКТИВНО' : opt;

                card.appendChild(badge);
                card.appendChild(cardCanvas);
                card.appendChild(span);
                gridContainer.appendChild(card);

                drawCardPreview(currentLayer, opt, cardCanvas);
            }
        }

        async function drawCardPreview(targetLayer, optionValue, targetCanvas) {
            const ctxCard = targetCanvas.getContext('2d');
            ctxCard.imageSmoothingEnabled = false;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 64;
            tempCanvas.height = 64;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.imageSmoothingEnabled = false;

            const imagePromises = layersConfig.map(l => {
                const val = (l.id === targetLayer.id) ? optionValue : state[l.id];
                if (val === 'none') return Promise.resolve(null);

                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${l.path}/${val}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) tempCtx.drawImage(img, 0, 0, 64, 64);
            });

            if (targetLayer.id === 'jacket') {
                ctxCard.drawImage(tempCanvas, 20, 20, 8, 12, 16, 8, 32, 48);
                ctxCard.drawImage(tempCanvas, 20, 36, 8, 12, 16, 8, 32, 48);
            } else {
                ctxCard.drawImage(tempCanvas, 8, 8, 8, 8, 0, 0, 64, 64);
                ctxCard.drawImage(tempCanvas, 40, 8, 8, 8, 0, 0, 64, 64);
            }
        }

        window.updateSkin = async function() {
            ctx.clearRect(0, 0, 64, 64);
            ctx.imageSmoothingEnabled = false;

            const imagePromises = layersConfig.map(layer => {
                const selectedOption = state[layer.id];
                if (selectedOption === 'none') return Promise.resolve(null);
                
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${layer.path}/${selectedOption}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) ctx.drawImage(img, 0, 0, 64, 64);
            });

            if (skinViewer) {
                skinViewer.loadSkin(hiddenCanvas.toDataURL(), {
                    model: isSlimArms ? "slim" : "default"
                });
            }
        }

        window.randomizeSkin = function() {
            layersConfig.forEach(layer => {
                const randomIndex = Math.floor(Math.random() * layer.options.length);
                state[layer.id] = layer.options[randomIndex];
            });
            updateSkin();
            renderTabs();
            renderGrid();
            updateActiveLayersCount();
        }

        window.resetSkin = function() {
            layersConfig.forEach((layer, idx) => {
                state[layer.id] = idx === 0 ? layer.options[0] : 'none';
            });
            updateSkin();
            renderTabs();
            renderGrid();
            updateActiveLayersCount();
        }

        window.downloadSkin = function() {
            const link = document.createElement('a');
            link.download = 'legendary_minecraft_skin.png';
            link.href = hiddenCanvas.toDataURL('image/png');
            link.click();
        }

        window.cycleAnimation = function() {
            animMode = (animMode + 1) % 3;
            const btn = document.getElementById('animToggle');
            if (animMode === 0) {
                skinViewer.animation = null;
                btn.classList.remove('active-mode');
                btn.innerText = "🚶 Стоп анимация";
            } else if (animMode === 1) {
                skinViewer.animation = new skinview3d.WalkingAnimation();
                skinViewer.animation.speed = 0.4;
                btn.classList.add('active-mode');
                btn.innerText = "🚶 Ходьба";
            } else if (animMode === 2) {
                skinViewer.animation = new skinview3d.RunningAnimation();
                skinViewer.animation.speed = 0.8;
                btn.classList.add('active-mode');
                btn.innerText = "🏃 Бег";
            }
        }

        window.toggleRotation = function() {
            isRotating = !isRotating;
            const btn = document.getElementById('rotToggle');
            if (isRotating) {
                skinViewer.autoRotate = true;
                btn.classList.add('active-mode');
                btn.innerText = "🔄 Вращение";
            } else {
                skinViewer.autoRotate = false;
                btn.classList.remove('active-mode');
                btn.innerText = "⏹️ Стоп вращ.";
            }
        }

        window.toggleArmThickness = function() {
            isSlimArms = !isSlimArms;
            const btn = document.getElementById('armToggle');
            if (isSlimArms) {
                btn.classList.add('active-mode');
                btn.innerText = "💪 Руки: Тонкие";
            } else {
                btn.classList.remove('active-mode');
                btn.innerText = "💪 Руки: Стандарт";
            }
            updateSkin();
        }

        window.cycleLighting = function() {
            lightingPreset = (lightingPreset + 1) % 3;
            const nameEl = document.getElementById('lightModeName');
            const dotEl = document.getElementById('lightDot');
            if (lightingPreset === 0) {
                skinViewer.globalLight.intensity = 1.3;
                skinViewer.cameraLight.intensity = 0.5;
                nameEl.innerText = "Студийный";
                dotEl.style.background = "var(--neon-cyan)";
            } else if (lightingPreset === 1) {
                skinViewer.globalLight.intensity = 2.0;
                skinViewer.cameraLight.intensity = 0.9;
                nameEl.innerText = "Неоновый";
                dotEl.style.background = "var(--neon-pink)";
            } else if (lightingPreset === 2) {
                skinViewer.globalLight.intensity = 0.6;
                skinViewer.cameraLight.intensity = 0.2;
                nameEl.innerText = "Мрачный Воид";
                dotEl.style.background = "var(--gold)";
            }
        }

        window.toggleCameraFOV = function() {
            currentFov = currentFov === 50 ? 35 : (currentFov === 35 ? 70 : 50);
            skinViewer.fov = currentFov;
            document.getElementById('fovValue').innerText = `${currentFov}°`;
        }

        initViewer();
        initUI();
        updateSkin();
    </script>
</body>
</html>
