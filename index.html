<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGENDARY MINECRAFT SKIN FORGE</title>
    <style>
        :root {
            --bg-void: #050508;
            --panel-bg: #0f0e17;
            --panel-border: #2a2740;
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.4);
            --neon-purple: #8b5cf6;
            --neon-cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Cinzel', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-void);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.06) 0%, transparent 40%);
        }

        /* Эпическая шапка */
        header {
            height: 70px;
            background: rgba(15, 14, 23, 0.9);
            border-bottom: 2px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .logo-title {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--gold-glow);
            text-transform: uppercase;
        }

        .header-stats {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            border: 1px dashed var(--panel-border);
            padding: 6px 14px;
            border-radius: 20px;
        }

        /* Главная рабочая область на весь экран */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 420px 1fr;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        /* Левая панель арсенала (Вкладки + Сетка) */
        .arsenal-panel {
            background: rgba(15, 14, 23, 0.95);
            border-right: 2px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            z-index: 5;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: 700;
        }

        /* Вкладки категорий */
        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .tabs-container::-webkit-scrollbar {
            height: 4px;
        }
        .tabs-container::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 2px;
        }

        .tab-btn {
            background: #171526;
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            border-color: var(--neon-purple);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--neon-purple), #6366f1);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        /* Сетка выбора элементов (Картинки без сглаживания) */
        .grid-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .grid-container::-webkit-scrollbar {
            width: 6px;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 3px;
        }

        .grid-card {
            background: #13121d;
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .grid-card:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.15);
        }

        .grid-card.selected {
            border-color: var(--gold);
            background: linear-gradient(135deg, #221d28, #191624);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        /* Четкие пиксельные превью без размытия */
        .grid-card canvas {
            width: 72px;
            height: 72px;
            background: #09080e;
            border-radius: 8px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 1px solid var(--panel-border);
        }

        .grid-card span {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .grid-card.selected span {
            color: var(--gold);
        }

        /* Правая зона: 3D Вьювер и Эпическое Управление */
        .viewport-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #141221 0%, #07060a 100%);
            padding: 30px;
        }

        #skin_container {
            width: 100%;
            height: 100%;
            max-width: 650px;
            max-height: 650px;
            cursor: grab;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9));
        }
        #skin_container:active {
            cursor: grabbing;
        }

        /* Панель управления снизу справа/по центру */
        .control-dock {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 15px;
            background: rgba(15, 14, 23, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid var(--panel-border);
            padding: 16px 24px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            z-index: 10;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .epic-btn {
            background: #1c1a29;
            color: var(--text-main);
            border: 2px solid var(--panel-border);
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .epic-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.2);
        }

        .epic-btn.active-mode {
            background: var(--gold);
            color: #050508;
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .epic-btn.primary {
            background: linear-gradient(135deg, var(--gold), #d97706);
            color: #050508;
            border-color: transparent;
            font-size: 0.95rem;
            padding: 14px 28px;
            box-shadow: 0 0 25px var(--gold-glow);
        }
        .epic-btn.primary:hover {
            filter: brightness(1.15);
            color: #050508;
        }

        .divider {
            width: 2px;
            height: 35px;
            background: var(--panel-border);
            margin: 0 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">⚡ Minecraft Skin Forge</div>
        <div class="header-stats">Режим: HD 3D Пространство • Пиксели хрустальные</div>
    </header>

    <div class="workspace">
        <!-- Левая панель выбора слоев -->
        <div class="arsenal-panel">
            <div>
                <div class="section-title">Категории слоев</div>
                <div class="tabs-container" id="tabsContainer"></div>
            </div>
            
            <div style="flex:1; display: flex; flex-direction: column; overflow: hidden;">
                <div class="section-title" id="activeCategoryTitle">Варианты</div>
                <div class="grid-container" id="gridContainer"></div>
            </div>
        </div>

        <!-- Правая часть с 3D моделью и эпической панелью управления -->
        <div class="viewport-section">
            <canvas id="skin_container"></canvas>

            <div class="control-dock">
                <button class="epic-btn active-mode" id="animToggle" onclick="toggleAnimation()">🚶 Плавная ходьба</button>
                <button class="epic-btn active-mode" id="rotToggle" onclick="toggleRotation()">🔄 Вращение</button>
                <button class="epic-btn" id="armToggle" onclick="toggleArmThickness()">💪 Руки: Стандарт</button>
                <div class="divider"></div>
                <button class="epic-btn primary" onclick="downloadSkin()">📥 Извлечь скин</button>
            </div>
        </div>
    </div>

    <!-- Скрытый холст для финальной сборки текстуры 64x64 -->
    <canvas id="hiddenCanvas" width="64" height="64" style="display:none;"></canvas>

    <script type="module">
        import * as skinview3d from 'https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/+esm';

        const layersConfig = [
            { id: 'skin', label: 'Кожа', path: 'skinmake/skin', options: ['1', '2', '3'] },
            { id: 'eyes', label: 'Глаза', path: 'skinmake/head/eyes', options: ['none', '1', '2', '3'] },
            { id: 'nose', label: 'Нос', path: 'skinmake/head/nose', options: ['none', '1', '2'] },
            { id: 'mouth', label: 'Рот', path: 'skinmake/head/mouth', options: ['none', '1', '2'] },
            { id: 'mustache', label: 'Усы', path: 'skinmake/head/mustache', options: ['none', '1', '2'] },
            { id: 'hair', label: 'Прическа', path: 'skinmake/head/hair', options: ['none', '1', '2', '3'] },
            { id: 'hair2', label: 'Прическа 2', path: 'skinmake/head/hair2', options: ['none', '1', '2'] },
            { id: 'jacket', label: 'Куртка', path: 'skinmake/body/jacket', options: ['none', '1', '2', '3'] }
        ];

        const state = {};
        let activeTab = 'skin';
        let skinViewer = null;
        let isAnimated = true;
        let isRotating = true;
        let isSlimArms = false; // false = default (4px), true = slim/Alex (3px)

        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');

        function initViewer() {
            const container = document.getElementById('skin_container');
            skinViewer = new skinview3d.SkinViewer({
                canvas: container,
                width: container.clientWidth || 500,
                height: container.clientHeight || 500,
                skin: null
            });

            skinViewer.autoRotate = true;
            skinViewer.autoRotateSpeed = 1.2;
            skinViewer.animation = new skinview3d.WalkingAnimation();
            skinViewer.animation.speed = 0.4; // Медленная, плавная и величественная ходьба
            skinViewer.globalLight.intensity = 1.3;
            skinViewer.cameraLight.intensity = 0.5;
            skinViewer.fov = 50;

            // Автоматическое масштабирование при изменении размера окна
            window.addEventListener('resize', () => {
                skinViewer.width = container.clientWidth;
                skinViewer.height = container.clientHeight;
            });
        }

        function initUI() {
            layersConfig.forEach(layer => {
                state[layer.id] = layer.options[0];
            });

            renderTabs();
            renderGrid();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';

            layersConfig.forEach(layer => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${activeTab === layer.id ? 'active' : ''}`;
                btn.innerText = layer.label;
                btn.onclick = () => {
                    activeTab = layer.id;
                    document.getElementById('activeCategoryTitle').innerText = `Выбор: ${layer.label}`;
                    renderTabs();
                    renderGrid();
                };
                tabsContainer.appendChild(btn);
            });
            document.getElementById('activeCategoryTitle').innerText = `Выбор: ${layersConfig.find(l => l.id === activeTab).label}`;
        }

        async function renderGrid() {
            const gridContainer = document.getElementById('gridContainer');
            gridContainer.innerHTML = '';

            const currentLayer = layersConfig.find(l => l.id === activeTab);
            if (!currentLayer) return;

            for (const opt of currentLayer.options) {
                const card = document.createElement('div');
                card.className = `grid-card ${state[activeTab] === opt ? 'selected' : ''}`;
                card.onclick = () => {
                    state[activeTab] = opt;
                    updateSkin();
                    renderGrid();
                };

                const cardCanvas = document.createElement('canvas');
                cardCanvas.width = 64;
                cardCanvas.height = 64;

                const span = document.createElement('span');
                span.innerText = opt === 'none' ? 'ПУСТО' : `СТИЛЬ #${opt}`;

                card.appendChild(cardCanvas);
                card.appendChild(span);
                gridContainer.appendChild(card);

                // Отрисовка четкого пиксельного превью элемента
                drawCardPreview(currentLayer, opt, cardCanvas);
            }
        }

        async function drawCardPreview(targetLayer, optionValue, targetCanvas) {
            const ctxCard = targetCanvas.getContext('2d');
            ctxCard.imageSmoothingEnabled = false;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 64;
            tempCanvas.height = 64;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.imageSmoothingEnabled = false;

            const imagePromises = layersConfig.map(l => {
                const val = (l.id === targetLayer.id) ? optionValue : state[l.id];
                if (val === 'none') return Promise.resolve(null);

                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${l.path}/${val}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) tempCtx.drawImage(img, 0, 0, 64, 64);
            });

            // Крупное детализированное пиксельное превью части лица или торса
            if (targetLayer.id === 'jacket') {
                ctxCard.drawImage(tempCanvas, 20, 20, 8, 12, 16, 8, 32, 48);
                ctxCard.drawImage(tempCanvas, 20, 36, 8, 12, 16, 8, 32, 48);
            } else {
                ctxCard.drawImage(tempCanvas, 8, 8, 8, 8, 0, 0, 64, 64);
                ctxCard.drawImage(tempCanvas, 40, 8, 8, 8, 0, 0, 64, 64);
            }
        }

        window.updateSkin = async function() {
            ctx.clearRect(0, 0, 64, 64);
            ctx.imageSmoothingEnabled = false;

            const imagePromises = layersConfig.map(layer => {
                const selectedOption = state[layer.id];
                if (selectedOption === 'none') return Promise.resolve(null);
                
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${layer.path}/${selectedOption}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) ctx.drawImage(img, 0, 0, 64, 64);
            });

            if (skinViewer) {
                // Передаем текстуру с учетом выбранного типа модели рук (slim / default)
                skinViewer.loadSkin(hiddenCanvas.toDataURL(), {
                    model: isSlimArms ? "slim" : "default"
                });
            }
        }

        window.downloadSkin = function() {
            const link = document.createElement('a');
            link.download = 'legendary_minecraft_skin.png';
            link.href = hiddenCanvas.toDataURL('image/png');
            link.click();
        }

        window.toggleAnimation = function() {
            isAnimated = !isAnimated;
            const btn = document.getElementById('animToggle');
            if (isAnimated) {
                skinViewer.animation = new skinview3d.WalkingAnimation();
                skinViewer.animation.speed = 0.4;
                btn.classList.add('active-mode');
                btn.innerText = "🚶 Плавная ходьба";
            } else {
                skinViewer.animation = null;
                btn.classList.remove('active-mode');
                btn.innerText = "🚶 Стоп ходьба";
            }
        }

        window.toggleRotation = function() {
            isRotating = !isRotating;
            const btn = document.getElementById('rotToggle');
            if (isRotating) {
                skinViewer.autoRotate = true;
                btn.classList.add('active-mode');
                btn.innerText = "🔄 Вращение";
            } else {
                skinViewer.autoRotate = false;
                btn.classList.remove('active-mode');
                btn.innerText = "⏹️ Стоп вращ.";
            }
        }

        window.toggleArmThickness = function() {
            isSlimArms = !isSlimArms;
            const btn = document.getElementById('armToggle');
            if (isSlimArms) {
                btn.classList.add('active-mode');
                btn.innerText = "💪 Руки: Тонкие (Alex)";
            } else {
                btn.classList.remove('active-mode');
                btn.innerText = "💪 Руки: Стандарт (Steve)";
            }
            updateSkin();
        }

        initViewer();
        initUI();
        updateSkin();
    </script>
</body>
</html>
