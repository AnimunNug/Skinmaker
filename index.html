<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Forge</title>
    <style>
        :root {
            --bg-base: #0f0e13;
            --panel-bg: #16151d;
            --panel-border: #262433;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Лаконичный шапка */
        header {
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 20;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .top-action-btn {
            background: #1e1c29;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-action-btn:hover {
            border-color: var(--accent);
            background: #252236;
        }

        /* Рабочая область */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 380px 1fr;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* Левая панель */
        .arsenal-panel {
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            z-index: 5;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* Компактные вкладки категорий */
        .tabs-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tabs-container::-webkit-scrollbar {
            height: 3px;
        }
        .tabs-container::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 2px;
        }

        .tab-btn {
            background: #1e1c29;
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .tab-status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: transparent;
        }

        .tab-btn.has-selection .tab-status-dot {
            background: var(--success);
        }
        .tab-btn.active .tab-status-dot {
            background: #fff;
        }

        /* Упрощенная сетка элементов */
        .grid-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .grid-container::-webkit-scrollbar {
            width: 4px;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 2px;
        }

        .grid-card {
            background: #121118;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .grid-card:hover {
            border-color: var(--text-muted);
            background: #181622;
        }

        .grid-card.selected {
            border-color: var(--accent);
            background: #1a1829;
        }

        .grid-card canvas {
            width: 64px;
            height: 64px;
            background: #0b0a0e;
            border-radius: 6px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .grid-card span {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .grid-card.selected span {
            color: var(--text-main);
        }

        /* Правая зона вьювера */
        .viewport-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0b0a0e;
            background-size: cover;
            background-position: center;
            padding: 20px;
            overflow: hidden;
            transition: background-image 0.3s ease;
        }

        #skin_container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #skin_container:active {
            cursor: grabbing;
        }

        /* Нижняя панель управления */
        .control-dock {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 10px;
            background: rgba(22, 21, 29, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            padding: 10px 16px;
            border-radius: 12px;
            z-index: 10;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .control-btn {
            background: #1e1c29;
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-btn:hover {
            border-color: var(--text-muted);
            background: #252236;
        }

        .control-btn.active-mode {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .control-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .control-btn.primary:hover {
            background: var(--accent-hover);
        }

        .divider {
            width: 1px;
            height: 24px;
            background: var(--panel-border);
            margin: 0 4px;
        }

        /* HUD в углу */
        .hud-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .hud-badge {
            background: rgba(22, 21, 29, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }
        .hud-badge:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }
        .hud-badge span.dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-title">Minecraft Skin Forge</div>
        </div>
        <div class="header-actions">
            <button class="top-action-btn" onclick="randomizeSkin()">🎲 Случайно</button>
            <button class="top-action-btn" onclick="resetSkin()">🗑️ Сбросить</button>
        </div>
    </header>

    <div class="workspace">
        <!-- Левая панель -->
        <div class="arsenal-panel">
            <div>
                <div class="section-header">
                    <div class="section-title">Категории</div>
                </div>
                <div class="tabs-container" id="tabsContainer"></div>
            </div>
            
            <div style="flex:1; display: flex; flex-direction: column; overflow: hidden;">
                <div class="section-header">
                    <div class="section-title" id="activeCategoryTitle">Выбор элемента</div>
                </div>
                <div class="grid-container" id="gridContainer"></div>
            </div>
        </div>

        <!-- Правая зона: 3D Вьювер -->
        <div class="viewport-section" id="viewportSection">
            <div class="hud-overlay">
                <div class="hud-badge" onclick="cycleLighting()"><span class="dot"></span> Свет: <span id="lightModeName">Студийный</span></div>
                <div class="hud-badge" onclick="toggleCameraFOV()">FOV: <span id="fovValue">50°</span></div>
            </div>

            <canvas id="skin_container"></canvas>

            <div class="control-dock">
                <div class="control-group">
                    <button class="control-btn active-mode" id="animToggle" onclick="cycleAnimation()">🚶 Ходьба</button>
                    <button class="control-btn active-mode" id="rotToggle" onclick="toggleRotation()">🔄 Вращение</button>
                </div>
                <div class="divider"></div>
                <div class="control-group">
                    <button class="control-btn" id="armToggle" onclick="toggleArmThickness()">💪 Руки</button>
                </div>
                <div class="divider"></div>
                <button class="control-btn primary" onclick="downloadSkin()">📥 Скачать</button>
            </div>
        </div>
    </div>

    <!-- Скрытый холст для сборки текстуры 64x64 -->
    <canvas id="hiddenCanvas" width="64" height="64" style="display:none;"></canvas>

    <script type="module">
        import * as skinview3d from 'https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/+esm';

        const layersConfig = [
            { id: 'skin', label: 'Кожа', path: 'skinmake/skin', options: ['1', '2', '3'] },
            { id: 'eyes', label: 'Глаза', path: 'skinmake/head/eyes', options: ['none', '1', '2', '3'] },
            { id: 'nose', label: 'Нос', path: 'skinmake/head/nose', options: ['none', '1', '2'] },
            { id: 'mouth', label: 'Рот', path: 'skinmake/head/mouth', options: ['none', '1', '2'] },
            { id: 'mustache', label: 'Усы', path: 'skinmake/head/mustache', options: ['none', '1', '2'] },
            { id: 'hair', label: 'Прическа', path: 'skinmake/head/hair', options: ['none', '1', '2', '3'] },
            { id: 'hair2', label: 'Прическа 2', path: 'skinmake/head/hair2', options: ['none', '1', '2'] },
            { id: 'jacket', label: 'Куртка', path: 'skinmake/body/jacket', options: ['none', '1', '2', '3'] },
            { id: 'background', label: 'Фон', path: 'skinmake/backgrounds', options: ['none', '1', '2', '3'], isBackground: true }
        ];

        const state = {};
        let activeTab = 'skin';
        let skinViewer = null;
        let animMode = 1;
        let isRotating = true;
        let isSlimArms = false;
        let lightingPreset = 0;
        let currentFov = 50;

        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');

        function initViewer() {
            const container = document.getElementById('skin_container');
            skinViewer = new skinview3d.SkinViewer({
                canvas: container,
                width: container.clientWidth || 600,
                height: container.clientHeight || 600,
                skin: null
            });

            skinViewer.autoRotate = true;
            skinViewer.autoRotateSpeed = 1.2;
            skinViewer.animation = new skinview3d.WalkingAnimation();
            skinViewer.animation.speed = 0.4;
            skinViewer.globalLight.intensity = 1.3;
            skinViewer.cameraLight.intensity = 0.5;
            skinViewer.fov = currentFov;

            window.addEventListener('resize', () => {
                skinViewer.width = container.clientWidth;
                skinViewer.height = container.clientHeight;
            });
        }

        function initUI() {
            layersConfig.forEach(layer => {
                state[layer.id] = layer.options[0];
            });

            renderTabs();
            renderGrid();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';

            layersConfig.forEach(layer => {
                const btn = document.createElement('button');
                const hasSel = state[layer.id] !== 'none' && layer.id !== 'skin' && !layer.isBackground;
                btn.className = `tab-btn ${activeTab === layer.id ? 'active' : ''} ${hasSel ? 'has-selection' : ''}`;
                
                btn.innerHTML = `
                    <span>${layer.label}</span>
                    <span class="tab-status-dot"></span>
                `;

                btn.onclick = () => {
                    activeTab = layer.id;
                    document.getElementById('activeCategoryTitle').innerText = `Элементы: ${layer.label}`;
                    renderTabs();
                    renderGrid();
                };
                tabsContainer.appendChild(btn);
            });
            document.getElementById('activeCategoryTitle').innerText = `Элементы: ${layersConfig.find(l => l.id === activeTab).label}`;
        }

        async function renderGrid() {
            const gridContainer = document.getElementById('gridContainer');
            gridContainer.innerHTML = '';

            const currentLayer = layersConfig.find(l => l.id === activeTab);
            if (!currentLayer) return;

            for (const opt of currentLayer.options) {
                const isSelected = state[activeTab] === opt;
                const card = document.createElement('div');
                card.className = `grid-card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => {
                    state[activeTab] = opt;
                    if (currentLayer.isBackground) {
                        updateBackground();
                    } else {
                        updateSkin();
                    }
                    renderTabs();
                    renderGrid();
                };

                if (currentLayer.isBackground) {
                    const bgPreview = document.createElement('div');
                    bgPreview.style.width = '64px';
                    bgPreview.style.height = '64px';
                    bgPreview.style.borderRadius = '6px';
                    bgPreview.style.background = opt === 'none' ? '#0b0a0e' : `url('${currentLayer.path}/${opt}.png') center/cover`;
                    bgPreview.style.border = '1px solid var(--panel-border)';

                    const span = document.createElement('span');
                    span.innerText = opt === 'none' ? 'Обычный' : `Фон #${opt}`;

                    card.appendChild(bgPreview);
                    card.appendChild(span);
                } else {
                    const cardCanvas = document.createElement('canvas');
                    cardCanvas.width = 64;
                    cardCanvas.height = 64;

                    const span = document.createElement('span');
                    span.innerText = opt === 'none' ? 'Пусто' : `Стиль #${opt}`;

                    card.appendChild(cardCanvas);
                    card.appendChild(span);

                    drawCardPreview(currentLayer, opt, cardCanvas);
                }

                gridContainer.appendChild(card);
            }
        }

        async function drawCardPreview(targetLayer, optionValue, targetCanvas) {
            const ctxCard = targetCanvas.getContext('2d');
            ctxCard.imageSmoothingEnabled = false;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 64;
            tempCanvas.height = 64;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.imageSmoothingEnabled = false;

            const imagePromises = layersConfig.filter(l => !l.isBackground).map(l => {
                const val = (l.id === targetLayer.id) ? optionValue : state[l.id];
                if (val === 'none') return Promise.resolve(null);

                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${l.path}/${val}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) tempCtx.drawImage(img, 0, 0, 64, 64);
            });

            if (targetLayer.id === 'jacket') {
                ctxCard.drawImage(tempCanvas, 20, 20, 8, 12, 16, 8, 32, 48);
                ctxCard.drawImage(tempCanvas, 20, 36, 8, 12, 16, 8, 32, 48);
            } else {
                ctxCard.drawImage(tempCanvas, 8, 8, 8, 8, 0, 0, 64, 64);
                ctxCard.drawImage(tempCanvas, 40, 8, 8, 8, 0, 0, 64, 64);
            }
        }

        window.updateBackground = function() {
            const viewport = document.getElementById('viewportSection');
            const bgVal = state['background'];
            if (bgVal === 'none') {
                viewport.style.backgroundImage = 'none';
            } else {
                viewport.style.backgroundImage = `url('skinmake/backgrounds/${bgVal}.png')`;
            }
        }

        window.updateSkin = async function() {
            ctx.clearRect(0, 0, 64, 64);
            ctx.imageSmoothingEnabled = false;

            const imagePromises = layersConfig.filter(l => !l.isBackground).map(layer => {
                const selectedOption = state[layer.id];
                if (selectedOption === 'none') return Promise.resolve(null);
                
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${layer.path}/${selectedOption}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) ctx.drawImage(img, 0, 0, 64, 64);
            });

            if (skinViewer) {
                skinViewer.loadSkin(hiddenCanvas.toDataURL(), {
                    model: isSlimArms ? "slim" : "default"
                });
            }
        }

        window.randomizeSkin = function() {
            layersConfig.forEach(layer => {
                const randomIndex = Math.floor(Math.random() * layer.options.length);
                state[layer.id] = layer.options[randomIndex];
            });
            updateSkin();
            updateBackground();
            renderTabs();
            renderGrid();
        }

        window.resetSkin = function() {
            layersConfig.forEach((layer, idx) => {
                state[layer.id] = (idx === 0 || layer.isBackground) ? layer.options[0] : 'none';
            });
            updateSkin();
            updateBackground();
            renderTabs();
            renderGrid();
        }

        window.downloadSkin = function() {
            const link = document.createElement('a');
            link.download = 'minecraft_skin.png';
            link.href = hiddenCanvas.toDataURL('image/png');
            link.click();
        }

        window.cycleAnimation = function() {
            animMode = (animMode + 1) % 3;
            const btn = document.getElementById('animToggle');
            if (animMode === 0) {
                skinViewer.animation = null;
                btn.classList.remove('active-mode');
                btn.innerText = "Стоп";
            } else if (animMode === 1) {
                skinViewer.animation = new skinview3d.WalkingAnimation();
                skinViewer.animation.speed = 0.4;
                btn.classList.add('active-mode');
                btn.innerText = "🚶 Ходьба";
            } else if (animMode === 2) {
                skinViewer.animation = new skinview3d.RunningAnimation();
                skinViewer.animation.speed = 0.8;
                btn.classList.add('active-mode');
                btn.innerText = "🏃 Бег";
            }
        }

        window.toggleRotation = function() {
            isRotating = !isRotating;
            const btn = document.getElementById('rotToggle');
            if (isRotating) {
                skinViewer.autoRotate = true;
                btn.classList.add('active-mode');
                btn.innerText = "🔄 Вращение";
            } else {
                skinViewer.autoRotate = false;
                btn.classList.remove('active-mode');
                btn.innerText = "⏹ Стоп";
            }
        }

        window.toggleArmThickness = function() {
            isSlimArms = !isSlimArms;
            const btn = document.getElementById('armToggle');
            if (isSlimArms) {
                btn.classList.add('active-mode');
                btn.innerText = "💪 Руки (Тонкие)";
            } else {
                btn.classList.remove('active-mode');
                btn.innerText = "💪 Руки";
            }
            updateSkin();
        }

        window.cycleLighting = function() {
            lightingPreset = (lightingPreset + 1) % 3;
            const nameEl = document.getElementById('lightModeName');
            if (lightingPreset === 0) {
                skinViewer.globalLight.intensity = 1.3;
                skinViewer.cameraLight.intensity = 0.5;
                nameEl.innerText = "Студийный";
            } else if (lightingPreset === 1) {
                skinViewer.globalLight.intensity = 2.0;
                skinViewer.cameraLight.intensity = 0.9;
                nameEl.innerText = "Яркий";
            } else if (lightingPreset === 2) {
                skinViewer.globalLight.intensity = 0.6;
                skinViewer.cameraLight.intensity = 0.2;
                nameEl.innerText = "Мрачный";
            }
        }

        window.toggleCameraFOV = function() {
            currentFov = currentFov === 50 ? 35 : (currentFov === 35 ? 70 : 50);
            skinViewer.fov = currentFov;
            document.getElementById('fovValue').innerText = `${currentFov}°`;
        }

        initViewer();
        initUI();
        updateSkin();
        updateBackground();
    </script>
</body>
</html>
