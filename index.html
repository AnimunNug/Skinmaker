<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Goofy Skin Constructor 3D</title>
    <style>
        :root {
            --bg-color: #0f0e17;
            --panel-bg: #1f1e2e;
            --card-bg: #29283e;
            --text-color: #fffffe;
            --accent-pink: #ff5964;
            --accent-green: #30e3ca;
            --accent-yellow: #ffcc00;
            --accent-purple: #9b51e0;
            --border-radius: 16px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#29283e 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .container {
            display: flex;
            gap: 30px;
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            border: 3px solid var(--accent-purple);
            box-shadow: 8px 8px 0px var(--accent-pink);
            max-width: 1050px;
            width: 100%;
            flex-wrap: wrap;
        }

        .controls {
            flex: 1.5;
            min-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Вкладки категорий - сочный нео-брутализм */
        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            border-bottom: 2px dashed #424059;
        }

        .tabs-container::-webkit-scrollbar {
            height: 6px;
        }
        .tabs-container::-webkit-scrollbar-thumb {
            background: var(--accent-purple);
            border-radius: 4px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid #424059;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn:hover {
            border-color: var(--accent-green);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background-color: var(--accent-green);
            color: #0f0e17;
            border-color: #0f0e17;
            box-shadow: 3px 3px 0px #0f0e17;
            transform: translateY(-2px);
        }

        /* Увеличенная сетка выбора элементов */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 14px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .grid-container::-webkit-scrollbar {
            width: 8px;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: var(--accent-pink);
            border-radius: 4px;
        }

        .grid-card {
            background-color: var(--card-bg);
            border: 2px solid #424059;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .grid-card:hover {
            border-color: var(--accent-yellow);
            transform: scale(1.03) rotate(-1deg);
        }

        .grid-card.selected {
            border-color: var(--accent-pink);
            background-color: #3b3956;
            box-shadow: 4px 4px 0px var(--accent-pink);
            transform: translateY(-3px);
        }

        .grid-card canvas {
            width: 72px;
            height: 72px;
            background-color: #14131c;
            border-radius: 8px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 1px solid #424059;
        }

        .grid-card span {
            font-size: 0.8em;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
        }

        .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            min-width: 280px;
        }

        /* 3D превью контейнер */
        #skin_container {
            width: 100%;
            height: 380px;
            background-color: #14131c;
            border: 3px solid var(--accent-yellow);
            border-radius: var(--border-radius);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            cursor: grab;
        }
        #skin_container:active {
            cursor: grabbing;
        }

        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        /* Кнопки в стиле playful goofy */
        .action-btn {
            padding: 12px 16px;
            background-color: var(--accent-yellow);
            color: #0f0e17;
            border: 2px solid #0f0e17;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95em;
            cursor: pointer;
            box-shadow: 4px 4px 0px #0f0e17;
            transition: all 0.1s ease;
            flex: 1;
            text-align: center;
        }

        .action-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #0f0e17;
        }
        
        .action-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #0f0e17;
        }

        .anim-btn {
            background-color: var(--accent-green);
        }

        .rot-btn {
            background-color: var(--accent-pink);
            color: #fffffe;
        }

        .download-btn {
            background-color: var(--accent-purple);
            color: #fffffe;
            width: 100%;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Меню с вкладками и увеличенной сеткой -->
        <div class="controls">
            <div class="tabs-container" id="tabsContainer"></div>
            <div class="grid-container" id="gridContainer"></div>
        </div>

        <div class="preview-section">
            <canvas id="skin_container"></canvas>
            
            <div class="button-group">
                <button class="action-btn anim-btn" id="animToggle" onclick="toggleAnimation()">🚶 Медленно</button>
                <button class="action-btn rot-btn" id="rotToggle" onclick="toggleRotation()">🔄 Кручение</button>
            </div>
            <button class="action-btn download-btn" onclick="downloadSkin()">📥 Скачать шедевр</button>
        </div>
    </div>

    <!-- Скрытый холст для финальной сборки текстуры 64x64 -->
    <canvas id="hiddenCanvas" width="64" height="64" style="display:none;"></canvas>

    <script type="module">
        import * as skinview3d from 'https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/+esm';

        const layersConfig = [
            { id: 'skin', label: '🥩 Кожа', path: 'skinmake/skin', options: ['1', '2', '3'] },
            { id: 'eyes', label: '👀 Глаза', path: 'skinmake/head/eyes', options: ['none', '1', '2', '3'] },
            { id: 'nose', label: '👃 Нос', path: 'skinmake/head/nose', options: ['none', '1', '2'] },
            { id: 'mouth', label: '👄 Рот', path: 'skinmake/head/mouth', options: ['none', '1', '2'] },
            { id: 'mustache', label: '🥸 Усы', path: 'skinmake/head/mustache', options: ['none', '1', '2'] },
            { id: 'hair', label: '💇 Прическа', path: 'skinmake/head/hair', options: ['none', '1', '2', '3'] },
            { id: 'hair2', label: '🧢 Прическа 2', path: 'skinmake/head/hair2', options: ['none', '1', '2'] },
            { id: 'jacket', label: '🧥 Куртка', path: 'skinmake/body/jacket', options: ['none', '1', '2', '3'] }
        ];

        const state = {};
        let activeTab = 'skin';
        let skinViewer = null;
        let isAnimated = true;
        let isRotating = true;

        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');

        function initViewer() {
            skinViewer = new skinview3d.SkinViewer({
                canvas: document.getElementById('skin_container'),
                width: 280,
                height: 380,
                skin: null
            });

            skinViewer.autoRotate = true;
            skinViewer.autoRotateSpeed = 1.5;
            skinViewer.animation = new skinview3d.WalkingAnimation();
            skinViewer.animation.speed = 0.4; // Медленная плавная анимация по заказу
            skinViewer.globalLight.intensity = 1.2;
            skinViewer.cameraLight.intensity = 0.4;
        }

        function initUI() {
            layersConfig.forEach(layer => {
                state[layer.id] = layer.options[0];
            });

            renderTabs();
            renderGrid();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';

            layersConfig.forEach(layer => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${activeTab === layer.id ? 'active' : ''}`;
                btn.innerText = layer.label;
                btn.onclick = () => {
                    activeTab = layer.id;
                    renderTabs();
                    renderGrid();
                };
                tabsContainer.appendChild(btn);
            });
        }

        async function renderGrid() {
            const gridContainer = document.getElementById('gridContainer');
            gridContainer.innerHTML = '';

            const currentLayer = layersConfig.find(l => l.id === activeTab);
            if (!currentLayer) return;

            for (const opt of currentLayer.options) {
                const card = document.createElement('div');
                card.className = `grid-card ${state[activeTab] === opt ? 'selected' : ''}`;
                card.onclick = () => {
                    state[activeTab] = opt;
                    updateSkin();
                    renderGrid();
                };

                const cardCanvas = document.createElement('canvas');
                cardCanvas.width = 64;
                cardCanvas.height = 64;

                const span = document.createElement('span');
                span.innerText = opt === 'none' ? 'Пусто' : `Стиль ${opt}`;

                card.appendChild(cardCanvas);
                card.appendChild(span);
                gridContainer.appendChild(card);

                drawCardPreview(currentLayer, opt, cardCanvas);
            }
        }

        async function drawCardPreview(targetLayer, optionValue, targetCanvas) {
            const ctxCard = targetCanvas.getContext('2d');
            ctxCard.imageSmoothingEnabled = false;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 64;
            tempCanvas.height = 64;
            const tempCtx = tempCanvas.getContext('2d');

            const imagePromises = layersConfig.map(l => {
                const val = (l.id === targetLayer.id) ? optionValue : state[l.id];
                if (val === 'none') return Promise.resolve(null);

                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${l.path}/${val}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) tempCtx.drawImage(img, 0, 0, 64, 64);
            });

            if (targetLayer.id === 'jacket') {
                ctxCard.drawImage(tempCanvas, 20, 20, 8, 12, 16, 8, 32, 48);
                ctxCard.drawImage(tempCanvas, 20, 36, 8, 12, 16, 8, 32, 48);
            } else {
                ctxCard.drawImage(tempCanvas, 8, 8, 8, 8, 0, 0, 64, 64);
                ctxCard.drawImage(tempCanvas, 40, 8, 8, 8, 0, 0, 64, 64);
            }
        }

        window.updateSkin = async function() {
            ctx.clearRect(0, 0, 64, 64);

            const imagePromises = layersConfig.map(layer => {
                const selectedOption = state[layer.id];
                if (selectedOption === 'none') return Promise.resolve(null);
                
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${layer.path}/${selectedOption}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) ctx.drawImage(img, 0, 0, 64, 64);
            });

            if (skinViewer) {
                skinViewer.loadSkin(hiddenCanvas.toDataURL());
            }
        }

        window.downloadSkin = function() {
            const link = document.createElement('a');
            link.download = 'goofy_custom_skin.png';
            link.href = hiddenCanvas.toDataURL('image/png');
            link.click();
        }

        window.toggleAnimation = function() {
            isAnimated = !isAnimated;
            const btn = document.getElementById('animToggle');
            if (isAnimated) {
                skinViewer.animation = new skinview3d.WalkingAnimation();
                skinViewer.animation.speed = 0.4;
                btn.innerText = "🚶 Медленно";
            } else {
                skinViewer.animation = null;
                btn.innerText = "🚶 Стоп";
            }
        }

        window.toggleRotation = function() {
            isRotating = !isRotating;
            const btn = document.getElementById('rotToggle');
            if (isRotating) {
                skinViewer.autoRotate = true;
                btn.innerText = "🔄 Кручение";
            } else {
                skinViewer.autoRotate = false;
                btn.innerText = "⏹️ Стоп круч.";
            }
        }

        initViewer();
        initUI();
        updateSkin();
    </script>
</body>
</html>
