<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Studio</title>
    <style>
        :root {
            --bg-base: #09090b;
            --panel-bg: rgba(18, 18, 24, 0.85);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Шапка с логотипом */
        header {
            height: 64px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
        }

        .action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
        }
        .action-btn.primary:hover {
            background: var(--accent-hover);
        }

        /* Рабочая зона */
        .workspace {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #050507;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            transition: background-image 0.4s ease;
        }

        #skin_container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #skin_container:active {
            cursor: grabbing;
        }

        /* Интерактивная панель управления (справа/плавающая) */
        .control-panel {
            position: absolute;
            right: 32px;
            top: 32px;
            width: 360px;
            max-height: calc(100vh - 128px);
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            z-index: 30;
            overflow-y: auto;
            animation: panelFade 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes panelFade {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 12px;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .panel-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .close-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* Сетка выбора элементов */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .option-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-card:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.2);
        }

        .option-card.selected {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }

        .option-card canvas {
            width: 56px;
            height: 56px;
            background: #09090b;
            border-radius: 6px;
            image-rendering: pixelated;
        }

        .option-card span {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .option-card.selected span {
            color: var(--text-main);
        }

        /* Подсказка снизу в центре */
        .interaction-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .interaction-hint b {
            color: var(--text-main);
        }

        /* Скрытые элементы */
        #hiddenCanvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">✨</div>
            <span>MINECRAFT SKIN STUDIO</span>
        </div>
        <div class="header-actions">
            <button class="action-btn" onclick="randomizeSkin()">🎲 Случайно</button>
            <button class="action-btn primary" onclick="downloadSkin()">📥 Скачать скин</button>
        </div>
    </header>

    <div class="workspace" id="workspace" onclick="handleBackgroundClick(event)">
        <canvas id="skin_container" onclick="handleModelClick(event)"></canvas>

        <div class="interaction-hint">
            💡 Кликните на <b>голову</b> для настройки лица/прически, на <b>тело</b> — для одежды. Кликните на <b>фон</b> для сброса.
        </div>

        <!-- Динамическая панель управления -->
        <div class="control-panel" id="controlPanel" onclick="event.stopPropagation()">
            <!-- Контент панели динамически меняется через JS -->
        </div>
    </div>

    <canvas id="hiddenCanvas" width="64" height="64"></canvas>

    <script type="module">
        import * as skinview3d from 'https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/+esm';

        const layersConfig = [
            { id: 'skin', label: 'Основа кожи', path: 'skinmake/skin', options: ['1', '2', '3'] },
            { id: 'eyes', label: 'Глаза', path: 'skinmake/head/eyes', options: ['none', '1', '2', '3'] },
            { id: 'nose', label: 'Нос', path: 'skinmake/head/nose', options: ['none', '1', '2'] },
            { id: 'mouth', label: 'Рот', path: 'skinmake/head/mouth', options: ['none', '1', '2'] },
            { id: 'mustache', label: 'Усы', path: 'skinmake/head/mustache', options: ['none', '1', '2'] },
            { id: 'hair', label: 'Прическа', path: 'skinmake/head/hair', options: ['none', '1', '2', '3'] },
            { id: 'jacket', label: 'Куртка / Одежда', path: 'skinmake/body/jacket', options: ['none', '1', '2', '3'] },
            { id: 'background', label: 'Фон сцены', path: 'skinmake/backgrounds', options: ['none', '1', '2', '3'], isBackground: true },
            { id: 'lighting', label: 'Освещение', options: ['Студийное', 'Яркое', 'Мрачное'], isLighting: true }
        ];

        const headLayers = ['eyes', 'nose', 'mouth', 'mustache', 'hair'];
        const bodyLayers = ['jacket'];
        const startLayers = ['skin', 'background', 'lighting'];

        const state = {};
        let currentMode = 'start'; // 'start', 'head', 'body'
        let skinViewer = null;
        let lightingPreset = 0;

        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');

        function initViewer() {
            const container = document.getElementById('skin_container');
            skinViewer = new skinview3d.SkinViewer({
                canvas: container,
                width: container.clientWidth,
                height: container.clientHeight,
                skin: null
            });

            skinViewer.autoRotate = false; // Отключаем авто-вращение для комфортного кликанья
            skinViewer.animation = new skinview3d.IdleAnimation();
            skinViewer.animation.speed = 0.6;
            skinViewer.globalLight.intensity = 1.3;
            skinViewer.cameraLight.intensity = 0.5;
            skinViewer.fov = 45;

            // Голова следит за курсором мыши
            window.addEventListener('mousemove', (e) => {
                if (!skinViewer || !skinViewer.playerObject) return;
                const xNorm = (e.clientX / window.innerWidth) * 2 - 1;
                const yNorm = -(e.clientY / window.innerHeight) * 2 + 1;
                
                skinViewer.playerObject.head.rotation.y = xNorm * 0.6;
                skinViewer.playerObject.head.rotation.x = -yNorm * 0.4;
            });

            window.addEventListener('resize', () => {
                skinViewer.width = container.clientWidth;
                skinViewer.height = container.clientHeight;
            });
        }

        function initDefaults() {
            layersConfig.forEach(layer => {
                state[layer.id] = layer.options[0];
            });
            switchPanel('start');
            updateSkin();
        }

        // Логика переключения интерфейсных режимов
        window.switchPanel = function(mode) {
            currentMode = mode;
            const panel = document.getElementById('controlPanel');
            panel.innerHTML = '';

            let title = '';
            let subtitle = '';
            let activeKeys = [];

            if (mode === 'start') {
                title = '🌟 Стартовая позиция';
                subtitle = 'Базовые настройки сцены и персонажа';
                activeKeys = startLayers;
            } else if (mode === 'head') {
                title = '👤 Настройка головы';
                subtitle = 'Прическа, лицо и головные элементы';
                activeKeys = headLayers;
            } else if (mode === 'body') {
                title = '👕 Настройка одежды';
                subtitle = 'Куртки, накидки и элементы тела';
                activeKeys = bodyLayers;
            }

            panel.innerHTML = `
                <div class="panel-header">
                    <div>
                        <div class="panel-title">${title}</div>
                        <div class="panel-subtitle">${subtitle}</div>
                    </div>
                    <div class="close-hint">${mode === 'start' ? 'Главная' : 'Клик на фон = сброс'}</div>
                </div>
                <div id="panelContent" style="display: flex; flex-direction: column; gap: 16px;"></div>
            `;

            const contentContainer = document.getElementById('panelContent');

            activeKeys.forEach(key => {
                const layer = layersConfig.find(l => l.id === key);
                if (!layer) return;

                const section = document.createElement('div');
                section.innerHTML = `<div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">${layer.label}</div>`;
                
                const grid = document.createElement('div');
                grid.className = 'options-grid';

                layer.options.forEach(opt => {
                    const card = document.createElement('div');
                    const isSelected = state[key] === opt;
                    card.className = `option-card ${isSelected ? 'selected' : ''}`;

                    card.onclick = (e) => {
                        e.stopPropagation();
                        state[key] = opt;
                        if (layer.isBackground) {
                            updateBackground();
                        } else if (layer.isLighting) {
                            updateLighting(opt);
                        } else {
                            updateSkin();
                        }
                        switchPanel(currentMode); // Перерисовываем панель
                    };

                    if (layer.isBackground) {
                        const bgPrev = document.createElement('div');
                        bgPrev.style.width = '56px';
                        bgPrev.style.height = '56px';
                        bgPrev.style.borderRadius = '6px';
                        bgPrev.style.background = opt === 'none' ? '#09090b' : `url('${layer.path}/${opt}.png') center/cover`;
                        bgPrev.style.border = '1px solid var(--panel-border)';
                        
                        const span = document.createElement('span');
                        span.innerText = opt === 'none' ? 'Пусто' : `Фон #${opt}`;
                        card.appendChild(bgPrev);
                        card.appendChild(span);
                    } else if (layer.isLighting) {
                        const icon = document.createElement('div');
                        icon.style.width = '56px';
                        icon.style.height = '56px';
                        icon.style.display = 'flex';
                        icon.style.alignItems = 'center';
                        icon.style.justifyContent = 'center';
                        icon.style.fontSize = '1.2rem';
                        icon.innerText = opt === 'Студийное' ? '💡' : (opt === 'Яркое' ? '☀️' : '🌙');
                        
                        const span = document.createElement('span');
                        span.innerText = opt;
                        card.appendChild(icon);
                        card.appendChild(span);
                    } else {
                        const cardCanvas = document.createElement('canvas');
                        cardCanvas.width = 56;
                        cardCanvas.height = 56;
                        
                        const span = document.createElement('span');
                        span.innerText = opt === 'none' ? 'Нет' : `Стиль #${opt}`;

                        card.appendChild(cardCanvas);
                        card.appendChild(span);
                        drawCardPreview(layer, opt, cardCanvas);
                    }

                    grid.appendChild(card);
                });

                section.appendChild(grid);
                contentContainer.appendChild(section);
            });
        }

        // Обработка клика по модели для определения части тела
        window.handleModelClick = function(event) {
            event.stopPropagation();
            
            // Реакция персонажа при клике (короткий прыжок / анимация)
            if (skinViewer && skinViewer.animation) {
                const prevAnim = skinViewer.animation;
                skinViewer.animation = new skinview3d.RunningAnimation();
                skinViewer.animation.speed = 1.5;
                setTimeout(() => {
                    if (skinViewer) skinViewer.animation = prevAnim;
                }, 400);
            }

            // Примерное определение области клика по центру экрана (где находится персонаж)
            // Верхняя половина экрана в пределах персонажа — голова, ниже — тело
            const rect = event.target.getBoundingClientRect();
            const yRel = event.clientY - rect.top;
            const height = rect.height;

            if (yRel < height * 0.45) {
                switchPanel('head');
            } else {
                switchPanel('body');
            }
        }

        // Клик по фону сбрасывает в стартовое меню
        window.handleBackgroundClick = function(event) {
            switchPanel('start');
        }

        async function drawCardPreview(targetLayer, optionValue, targetCanvas) {
            const ctxCard = targetCanvas.getContext('2d');
            ctxCard.imageSmoothingEnabled = false;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 64;
            tempCanvas.height = 64;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.imageSmoothingEnabled = false;

            const activeRelevantLayers = layersConfig.filter(l => !l.isBackground && !l.isLighting);
            const imagePromises = activeRelevantLayers.map(l => {
                const val = (l.id === targetLayer.id) ? optionValue : state[l.id];
                if (val === 'none') return Promise.resolve(null);

                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${l.path}/${val}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) tempCtx.drawImage(img, 0, 0, 64, 64);
            });

            if (targetLayer.id === 'jacket') {
                ctxCard.drawImage(tempCanvas, 20, 20, 8, 12, 4, 4, 48, 48);
            } else {
                ctxCard.drawImage(tempCanvas, 8, 8, 8, 8, 0, 0, 64, 64);
                ctxCard.drawImage(tempCanvas, 40, 8, 8, 8, 0, 0, 64, 64);
            }
        }

        window.updateBackground = function() {
            const workspace = document.getElementById('workspace');
            const bgVal = state['background'];
            if (bgVal === 'none') {
                workspace.style.backgroundImage = 'none';
            } else {
                workspace.style.backgroundImage = `url('skinmake/backgrounds/${bgVal}.png')`;
            }
        }

        window.updateLighting = function(presetName) {
            if (!skinViewer) return;
            if (presetName === 'Студийное') {
                skinViewer.globalLight.intensity = 1.3;
                skinViewer.cameraLight.intensity = 0.5;
            } else if (presetName === 'Яркое') {
                skinViewer.globalLight.intensity = 2.2;
                skinViewer.cameraLight.intensity = 1.0;
            } else if (presetName === 'Мрачное') {
                skinViewer.globalLight.intensity = 0.5;
                skinViewer.cameraLight.intensity = 0.1;
            }
        }

        window.updateSkin = async function() {
            ctx.clearRect(0, 0, 64, 64);
            ctx.imageSmoothingEnabled = false;

            const relevantLayers = layersConfig.filter(l => !l.isBackground && !l.isLighting);
            const imagePromises = relevantLayers.map(layer => {
                const selectedOption = state[layer.id];
                if (selectedOption === 'none') return Promise.resolve(null);
                
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${layer.path}/${selectedOption}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) ctx.drawImage(img, 0, 0, 64, 64);
            });

            if (skinViewer) {
                skinViewer.loadSkin(hiddenCanvas.toDataURL());
            }
        }

        window.randomizeSkin = function() {
            layersConfig.forEach(layer => {
                if (!layer.isBackground && !layer.isLighting) {
                    const randomIndex = Math.floor(Math.random() * layer.options.length);
                    state[layer.id] = layer.options[randomIndex];
                }
            });
            updateSkin();
            switchPanel(currentMode);
        }

        window.downloadSkin = function() {
            const link = document.createElement('a');
            link.download = 'minecraft_custom_skin.png';
            link.href = hiddenCanvas.toDataURL('image/png');
            link.click();
        }

        initViewer();
        initDefaults();
    </script>
</body>
</html>
