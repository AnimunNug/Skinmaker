<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Studio - Live Edition</title>
    <style>
        :root {
            --bg-base: #09090b;
            --panel-bg: rgba(18, 18, 24, 0.9);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 64px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            -webkit-text-fill-color: #fff;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
        }

        .action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
        }
        .action-btn.primary:hover {
            background: var(--accent-hover);
        }

        .workspace {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #050507;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            transition: background-image 0.4s ease;
        }

        #skin_container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #skin_container:active {
            cursor: grabbing;
        }

        /* Плавающее контекстное окно */
        .floating-popover {
            position: absolute;
            width: 340px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            z-index: 40;
            opacity: 0;
            transform: scale(0.95) translateY(10px);
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .floating-popover.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .popover-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 10px;
            cursor: grab;
        }
        .popover-header:active {
            cursor: grabbing;
        }

        .popover-title {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .options-grid::-webkit-scrollbar {
            width: 4px;
        }
        .options-grid::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 2px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .option-card.selected {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.15);
        }

        .option-card canvas, .option-card .preview-box {
            width: 48px;
            height: 48px;
            background: #09090b;
            border-radius: 6px;
            image-rendering: pixelated;
        }

        .option-card span {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .option-card.selected span {
            color: var(--text-main);
        }

        .interaction-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .interaction-hint b {
            color: var(--text-main);
        }

        #hiddenCanvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">✨</div>
            <span>MINECRAFT SKIN STUDIO</span>
        </div>
        <div class="header-actions">
            <button class="action-btn" onclick="randomizeSkin()">🎲 Случайно</button>
            <button class="action-btn primary" onclick="downloadSkin()">📥 Скачать скин</button>
        </div>
    </header>

    <div class="workspace" id="workspace" onclick="handleBackgroundClick(event)">
        <canvas id="skin_container"></canvas>

        <div class="interaction-hint" id="interactionHint">
            💡 Кликните на <b>голову</b> или <b>тело</b> персонажа для кастомизации. Клик на фон — сброс.
        </div>

        <!-- Плавающее окно настройки -->
        <div class="floating-popover" id="floatingPopover" onclick="event.stopPropagation()">
            <div class="popover-header" id="popoverHeader" onmousedown="startDrag(event)">
                <span class="popover-title" id="popoverTitle">Настройка</span>
                <div class="close-btn" onclick="closePopover()">✕</div>
            </div>
            <div id="popoverContent" style="display: flex; flex-direction: column; gap: 14px;"></div>
        </div>
    </div>

    <canvas id="hiddenCanvas" width="64" height="64"></canvas>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        import * as skinview3d from 'https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/+esm';

        const layersConfig = [
            { id: 'skin', label: 'База кожи', path: 'skinmake/skin', options: ['1', '2', '3'] },
            { id: 'eyes', label: 'Глаза', path: 'skinmake/head/eyes', options: ['none', '1', '2', '3'], category: 'head' },
            { id: 'nose', label: 'Нос', path: 'skinmake/head/nose', options: ['none', '1', '2'], category: 'head' },
            { id: 'mouth', label: 'Рот', path: 'skinmake/head/mouth', options: ['none', '1', '2'], category: 'head' },
            { id: 'mustache', label: 'Усы', path: 'skinmake/head/mustache', options: ['none', '1', '2'], category: 'head' },
            { id: 'hair', label: 'Прическа', path: 'skinmake/head/hair', options: ['none', '1', '2', '3'], category: 'head' },
            { id: 'jacket', label: 'Куртка / Одежда', path: 'skinmake/body/jacket', options: ['none', '1', '2', '3'], category: 'body' },
            { id: 'background', label: 'Фон сцены', path: 'skinmake/backgrounds', options: ['none', '1', '2', '3'], isBackground: true },
            { id: 'lighting', label: 'Освещение', options: ['Студийное', 'Яркое', 'Мрачное'], isLighting: true }
        ];

        const state = {};
        let skinViewer = null;
        let activeCategory = null; // 'head', 'body', or null
        
        // Raycaster для точного определения частей тела
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Перетаскивание попловера
        let isDragging = false, dragOffsetX = 0, dragOffsetY = 0;

        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');

        function initViewer() {
            const container = document.getElementById('skin_container');
            skinViewer = new skinview3d.SkinViewer({
                canvas: container,
                width: container.clientWidth,
                height: container.clientHeight,
                skin: null
            });

            skinViewer.autoRotate = false;
            skinViewer.animation = new skinview3d.IdleAnimation();
            skinViewer.animation.speed = 0.5;
            skinViewer.globalLight.intensity = 1.3;
            skinViewer.cameraLight.intensity = 0.5;
            skinViewer.fov = 45;

            // Только голова следит за курсором, не ломая вращение камеры
            window.addEventListener('mousemove', (e) => {
                if (!skinViewer || !skinViewer.playerObject) return;
                const xNorm = (e.clientX / window.innerWidth) * 2 - 1;
                const yNorm = -(e.clientY / window.innerHeight) * 2 + 1;
                
                // Плавное слежение только головой
                skinViewer.playerObject.head.rotation.y = THREE.MathUtils.lerp(skinViewer.playerObject.head.rotation.y, xNorm * 0.5, 0.1);
                skinViewer.playerObject.head.rotation.x = THREE.MathUtils.lerp(skinViewer.playerObject.head.rotation.x, -yNorm * 0.3, 0.1);
            });

            // Обработка клика с Raycasting
            container.addEventListener('pointerdown', handleCanvasPointerDown);

            window.addEventListener('resize', () => {
                skinViewer.width = container.clientWidth;
                skinViewer.height = container.clientHeight;
            });
        }

        function initDefaults() {
            layersConfig.forEach(layer => {
                state[layer.id] = layer.options[0];
            });
            updateSkin();
        }

        // Продвинутый Raycasting для определения головы / тела / рук
        function handleCanvasPointerDown(event) {
            const rect = event.target.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, skinViewer.camera);
            
            // Собираем все меши персонажа
            const intersects = raycaster.intersectObjects(skinViewer.scene.children, true);

            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                let current = hitObject;
                let partName = null;

модификация: // Поднимаемся по дереву объектов для поиска конкретной части
                while (current && current !== skinViewer.scene) {
                    if (current === skinViewer.playerObject.head) {
                        partName = 'head';
                        break;
                    } else if (current === skinViewer.playerObject.rightArm || current === skinViewer.playerObject.leftArm || current === skinViewer.playerObject.body || current === skinViewer.playerObject.jacket) {
                        partName = 'body';
                        break;
                    } else if (current === skinViewer.playerObject.rightLeg || current === skinViewer.playerObject.leftLeg) {
                        partName = 'body'; // Ноги относим к телу/одежде
                        break;
                    }
                    current = current.parent;
                }

                if (partName) {
                    openPopover(partName, event.clientX, event.clientY);
                    playAliveReaction();
                    event.stopPropagation();
                } else {
                    closePopover();
                }
            } else {
                closePopover();
            }
        }

        // Оживленная мягкая реакция персонажа ("мультяшный" отклик)
        function playAliveReaction() {
            if (!skinViewer || !skinViewer.playerObject) return;
            const originalAnim = skinViewer.animation;
            
            // Плавный кивок / подпрыгивание
            skinViewer.animation = new class extends skinview3d.Animation {
                animate(player, time) {
                    player.rotation.y += 0.02; // Легкий поворот
                    player.head.rotation.z = Math.sin(time * 15) * 0.1; // Удивленный наклон головы
                }
            };

            setTimeout(() => {
                if (skinViewer) skinViewer.animation = originalAnim;
            }, 600);
        }

        // Открытие плавающего окна возле курсора или части тела
        window.openPopover = function(category, clientX, clientY) {
            activeCategory = category;
            const popover = document.getElementById('floatingPopover');
            const titleEl = document.getElementById('popoverTitle');
            const contentEl = document.getElementById('popoverContent');

            titleEl.innerText = category === 'head' ? '👤 Настройка головы' : '👕 Настройка одежды и тела';
            contentEl.innerHTML = '';

            const relevantLayers = layersConfig.filter(l => l.category === category);

            relevantLayers.forEach(layer => {
                const section = document.createElement('div');
                section.innerHTML = `<div style="font-size:0.7rem; font-weight:700; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px;">${layer.label}</div>`;
                
                const grid = document.createElement('div');
                grid.className = 'options-grid';

                layer.options.forEach(opt => {
                    const card = document.createElement('div');
                    const isSelected = state[layer.id] === opt;
                    card.className = `option-card ${isSelected ? 'selected' : ''}`;

                    card.onclick = (e) => {
                        e.stopPropagation();
                        state[layer.id] = opt;
                        updateSkin();
                        openPopover(category, clientX, clientY); // Перерисовка окна
                    };

                    const cardCanvas = document.createElement('canvas');
                    cardCanvas.width = 48;
                    cardCanvas.height = 48;
                    
                    const span = document.createElement('span');
                    span.innerText = opt === 'none' ? 'Нет' : `Стиль #${opt}`;

                    card.appendChild(cardCanvas);
                    card.appendChild(span);
                    grid.appendChild(card);
                    drawCardPreview(layer, opt, cardCanvas);
                });

                section.appendChild(grid);
                contentEl.appendChild(section);
            });

            // Позиционирование окна в пределах экрана
            let posX = clientX + 20;
            let posY = clientY - 50;
            if (posX + 350 > window.innerWidth) posX = window.innerWidth - 370;
            if (posY + 400 > window.innerHeight) posY = window.innerHeight - 420;
            if (posY < 80) posY = 80;

            popover.style.left = `${posX}px`;
            popover.style.top = `${posY}px`;
            popover.classList.add('active');
        }

        window.closePopover = function() {
            const popover = document.getElementById('floatingPopover');
            popover.classList.remove('active');
            activeCategory = null;
        }

        window.handleBackgroundClick = function(event) {
            closePopover();
        }

        // Перетаскивание попловера за шапку
        window.startDrag = function(e) {
            isDragging = true;
            const popover = document.getElementById('floatingPopover');
            const rect = popover.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;

            function onMouseMove(moveEvent) {
                if (!isDragging) return;
                popover.style.left = `${moveEvent.clientX - dragOffsetX}px`;
                popover.style.top = `${moveEvent.clientY - dragOffsetY}px`;
            }

            function onMouseUp() {
                isDragging = false;
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            }

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        async function drawCardPreview(targetLayer, optionValue, targetCanvas) {
            const ctxCard = targetCanvas.getContext('2d');
            ctxCard.imageSmoothingEnabled = false;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 64;
            tempCanvas.height = 64;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.imageSmoothingEnabled = false;

            const activeRelevantLayers = layersConfig.filter(l => !l.isBackground && !l.isLighting);
            const imagePromises = activeRelevantLayers.map(l => {
                const val = (l.id === targetLayer.id) ? optionValue : state[l.id];
                if (val === 'none') return Promise.resolve(null);

                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${l.path}/${val}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) tempCtx.drawImage(img, 0, 0, 64, 64);
            });

            if (targetLayer.id === 'jacket') {
                ctxCard.drawImage(tempCanvas, 20, 20, 8, 12, 8, 8, 32, 32);
            } else {
                ctxCard.drawImage(tempCanvas, 8, 8, 8, 8, 0, 0, 48, 48);
                ctxCard.drawImage(tempCanvas, 40, 8, 8, 8, 0, 0, 48, 48);
            }
        }

        window.updateSkin = async function() {
            ctx.clearRect(0, 0, 64, 64);
            ctx.imageSmoothingEnabled = false;

            const relevantLayers = layersConfig.filter(l => !l.isBackground && !l.isLighting);
            const imagePromises = relevantLayers.map(layer => {
                const selectedOption = state[layer.id];
                if (selectedOption === 'none') return Promise.resolve(null);
                
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${layer.path}/${selectedOption}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) ctx.drawImage(img, 0, 0, 64, 64);
            });

            if (skinViewer) {
                skinViewer.loadSkin(hiddenCanvas.toDataURL());
            }
        }

        window.randomizeSkin = function() {
            layersConfig.forEach(layer => {
                if (!layer.isBackground && !layer.isLighting) {
                    const randomIndex = Math.floor(Math.random() * layer.options.length);
                    state[layer.id] = layer.options[randomIndex];
                }
            });
            updateSkin();
        }

        window.downloadSkin = function() {
            const link = document.createElement('a');
            link.download = 'minecraft_custom_skin.png';
            link.href = hiddenCanvas.toDataURL('image/png');
            link.click();
        }

        initViewer();
        initDefaults();
    </script>
</body>
</html>
