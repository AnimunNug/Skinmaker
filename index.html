<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Constructor 3D</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #282a36;
            --text-color: #f8f8f2;
            --accent-color: #bd93f9;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            gap: 30px;
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 980px;
            width: 100%;
            flex-wrap: wrap;
        }

        .controls {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Вкладки категорий */
        .tabs-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            border-bottom: 1px solid #44475a;
        }

        .tabs-container::-webkit-scrollbar {
            height: 4px;
        }
        .tabs-container::-webkit-scrollbar-thumb {
            background: #6272a4;
            border-radius: 2px;
        }

        .tab-btn {
            background-color: #44475a;
            color: var(--text-color);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }

        .tab-btn:hover {
            background-color: #6272a4;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #282a36;
        }

        /* Сетка выбора элементов */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .grid-container::-webkit-scrollbar {
            width: 6px;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: #6272a4;
            border-radius: 3px;
        }

        .grid-card {
            background-color: #313342;
            border: 2px solid #44475a;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .grid-card:hover {
            border-color: #8be9fd;
            transform: translateY(-2px);
        }

        .grid-card.selected {
            border-color: var(--accent-color);
            background-color: #3a3d52;
            box-shadow: 0 0 10px rgba(189, 147, 249, 0.3);
        }

        .grid-card canvas {
            width: 64px;
            height: 64px;
            background-color: #1e1e2e;
            border-radius: 4px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .grid-card span {
            font-size: 0.75em;
            font-weight: 600;
            color: var(--text-color);
            text-align: center;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            min-width: 300px;
        }

        /* Контейнер для 3D-модели */
        #skin_container {
            width: 300px;
            height: 400px;
            background-color: #15151d;
            border: 2px dashed #6272a4;
            border-radius: var(--border-radius);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            cursor: grab;
        }
        #skin_container:active {
            cursor: grabbing;
        }

        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            padding: 10px 16px;
            background-color: var(--accent-color);
            color: #282a36;
            border: none;
            border-radius: var(--border-radius);
            font-weight: bold;
            font-size: 0.95em;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            flex: 1;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        
        button:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            background-color: #44475a;
            color: var(--text-color);
            border: 1px solid #6272a4;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Наглядное меню с вкладками и сеткой -->
        <div class="controls">
            <div class="tabs-container" id="tabsContainer"></div>
            <div class="grid-container" id="gridContainer"></div>
        </div>

        <div class="preview-section">
            <canvas id="skin_container"></canvas>
            
            <div class="button-group">
                <button class="secondary-btn" id="animToggle" onclick="toggleAnimation()">Анимация: Вкл</button>
                <button onclick="downloadSkin()">Скачать скин</button>
            </div>
        </div>
    </div>

    <!-- Скрытый холст для финальной сборки текстуры 64x64 -->
    <canvas id="hiddenCanvas" width="64" height="64" style="display:none;"></canvas>

    <script type="module">
        import * as skinview3d from 'https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/+esm';

        const layersConfig = [
            { id: 'skin', label: 'Кожа', path: 'skinmake/skin', options: ['1', '2', '3'] },
            { id: 'eyes', label: 'Глаза', path: 'skinmake/head/eyes', options: ['none', '1', '2', '3'] },
            { id: 'nose', label: 'Нос', path: 'skinmake/head/nose', options: ['none', '1', '2'] },
            { id: 'mouth', label: 'Рот', path: 'skinmake/head/mouth', options: ['none', '1', '2'] },
            { id: 'mustache', label: 'Усы', path: 'skinmake/head/mustache', options: ['none', '1', '2'] },
            { id: 'hair', label: 'Прическа', path: 'skinmake/head/hair', options: ['none', '1', '2', '3'] },
            { id: 'hair2', label: 'Прическа 2', path: 'skinmake/head/hair2', options: ['none', '1', '2'] },
            { id: 'jacket', label: 'Куртка', path: 'skinmake/body/jacket', options: ['none', '1', '2', '3'] }
        ];

        const state = {};
        let activeTab = 'skin';
        let skinViewer = null;
        let isAnimated = true;

        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');

        function initViewer() {
            skinViewer = new skinview3d.SkinViewer({
                canvas: document.getElementById('skin_container'),
                width: 300,
                height: 400,
                skin: null
            });

            skinViewer.autoRotate = true;
            skinViewer.autoRotateSpeed = 1.5;
            skinViewer.animation = new skinview3d.WalkingAnimation();
            skinViewer.animation.speed = 1.0;
            skinViewer.globalLight.intensity = 1.2;
            skinViewer.cameraLight.intensity = 0.4;
        }

        function initUI() {
            layersConfig.forEach(layer => {
                state[layer.id] = layer.options[0];
            });

            renderTabs();
            renderGrid();
        }

        // Отрисовка шапки с вкладками
        function renderTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';

            layersConfig.forEach(layer => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${activeTab === layer.id ? 'active' : ''}`;
                btn.innerText = layer.label;
                btn.onclick = () => {
                    activeTab = layer.id;
                    renderTabs();
                    renderGrid();
                };
                tabsContainer.appendChild(btn);
            });
        }

        // Отрисовка сетки выбора элементов текущей вкладки
        async function renderGrid() {
            const gridContainer = document.getElementById('gridContainer');
            gridContainer.innerHTML = '';

            const currentLayer = layersConfig.find(l => l.id === activeTab);
            if (!currentLayer) return;

            for (const opt of currentLayer.options) {
                const card = document.createElement('div');
                card.className = `grid-card ${state[activeTab] === opt ? 'selected' : ''}`;
                card.onclick = () => {
                    state[activeTab] = opt;
                    updateSkin();
                    renderGrid();
                };

                const cardCanvas = document.createElement('canvas');
                cardCanvas.width = 64;
                cardCanvas.height = 64;

                const span = document.createElement('span');
                span.innerText = opt === 'none' ? 'Пусто' : `Вариант ${opt}`;

                card.appendChild(cardCanvas);
                card.appendChild(span);
                gridContainer.appendChild(card);

                // Генерация мини-превью для карточки (показывает лицо/торс с этим элементом)
                drawCardPreview(currentLayer, opt, cardCanvas);
            }
        }

        // Функция формирования мини-превью в карточке сетки
        async function drawCardPreview(targetLayer, optionValue, targetCanvas) {
            const ctxCard = targetCanvas.getContext('2d');
            ctxCard.imageSmoothingEnabled = false;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 64;
            tempCanvas.height = 64;
            const tempCtx = tempCanvas.getContext('2d');

            const imagePromises = layersConfig.map(l => {
                const val = (l.id === targetLayer.id) ? optionValue : state[l.id];
                if (val === 'none') return Promise.resolve(null);

                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${l.path}/${val}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) tempCtx.drawImage(img, 0, 0, 64, 64);
            });

            // Для куртки выводим торс, для остальных элементов — голову
            if (targetLayer.id === 'jacket') {
                ctxCard.drawImage(tempCanvas, 20, 20, 8, 12, 16, 8, 32, 48);
                ctxCard.drawImage(tempCanvas, 20, 36, 8, 12, 16, 8, 32, 48);
            } else {
                ctxCard.drawImage(tempCanvas, 8, 8, 8, 8, 0, 0, 64, 64);
                ctxCard.drawImage(tempCanvas, 40, 8, 8, 8, 0, 0, 64, 64);
            }
        }

        // Общая сборка скина и передача в 3D-вьювер
        window.updateSkin = async function() {
            ctx.clearRect(0, 0, 64, 64);

            const imagePromises = layersConfig.map(layer => {
                const selectedOption = state[layer.id];
                if (selectedOption === 'none') return Promise.resolve(null);
                
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${layer.path}/${selectedOption}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) ctx.drawImage(img, 0, 0, 64, 64);
            });

            if (skinViewer) {
                skinViewer.loadSkin(hiddenCanvas.toDataURL());
            }
        }

        window.downloadSkin = function() {
            const link = document.createElement('a');
            link.download = 'custom_skin.png';
            link.href = hiddenCanvas.toDataURL('image/png');
            link.click();
        }

        window.toggleAnimation = function() {
            isAnimated = !isAnimated;
            const btn = document.getElementById('animToggle');
            if (isAnimated) {
                skinViewer.animation = new skinview3d.WalkingAnimation();
                btn.innerText = "Анимация: Вкл";
            } else {
                skinViewer.animation = null;
                btn.innerText = "Анимация: Выкл";
            }
        }

        initViewer();
        initUI();
        updateSkin();
    </script>
</body>
</html>
