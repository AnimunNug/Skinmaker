<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Studio Pro</title>
    <style>
        :root {
            --bg-base: #09090b;
            --panel-bg: rgba(18, 18, 24, 0.9);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Шапка с логотипом */
        header {
            height: 64px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
        }

        .action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
        }
        .action-btn.primary:hover {
            background: var(--accent-hover);
        }

        /* Рабочая зона */
        .workspace {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #050507;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            transition: background-image 0.4s ease;
        }

        #skin_container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #skin_container:active {
            cursor: grabbing;
        }

        /* Плавающие контекстные окна (draggable) */
        .floating-panel {
            position: absolute;
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 40;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .floating-panel.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .panel-header-drag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 10px;
            cursor: grab;
        }
        .panel-header-drag:active {
            cursor: grabbing;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .close-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .close-btn:hover {
            background: rgba(255,255,255,0.15);
            color: var(--text-main);
        }

        /* Сетка выбора элементов */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .options-grid::-webkit-scrollbar {
            width: 4px;
        }
        .options-grid::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 2px;
        }

        .option-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }

        .option-card.selected {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.15);
        }

        .option-card canvas {
            width: 48px;
            height: 48px;
            background: #09090b;
            border-radius: 6px;
            image-rendering: pixelated;
        }

        .option-card span {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .option-card.selected span {
            color: var(--text-main);
        }

        /* Стартовая панель настроек (сцена, освещение, основа) */
        .start-dock {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            z-index: 30;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .dock-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dock-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .dock-options {
            display: flex;
            gap: 6px;
        }

        .dock-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dock-btn:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.1);
        }
        .dock-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .interaction-hint {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .interaction-hint b {
            color: var(--text-main);
        }

        #hiddenCanvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">✨</div>
            <span>MINECRAFT SKIN STUDIO</span>
        </div>
        <div class="header-actions">
            <button class="action-btn" onclick="randomizeSkin()">🎲 Случайно</button>
            <button class="action-btn primary" onclick="downloadSkin()">📥 Скачать скин</button>
        </div>
    </header>

    <div class="workspace" id="workspace" onclick="handleBackgroundClick(event)">
        <div class="interaction-hint">
            💡 Наведите на часть тела для подсветки, кликните для настройки. Клик на фон — сброс.
        </div>

        <canvas id="skin_container"></canvas>

        <!-- Плавающее окно для Головы -->
        <div class="floating-panel" id="panel_head">
            <div class="panel-header-drag" onmousedown="startDrag(event, 'panel_head')">
                <div class="panel-title">👤 Настройка головы</div>
                <div class="close-btn" onclick="closePanels()">✕</div>
            </div>
            <div id="content_head"></div>
        </div>

        <!-- Плавающее окно для Тела/Куртки -->
        <div class="floating-panel" id="panel_body">
            <div class="panel-header-drag" onmousedown="startDrag(event, 'panel_body')">
                <div class="panel-title">👕 Настройка одежды</div>
                <div class="close-btn" onclick="closePanels()">✕</div>
            </div>
            <div id="content_body"></div>
        </div>

        <!-- Плавающее окно для Рук -->
        <div class="floating-panel" id="panel_arms">
            <div class="panel-header-drag" onmousedown="startDrag(event, 'panel_arms')">
                <div class="panel-title">💪 Настройка рук</div>
                <div class="close-btn" onclick="closePanels()">✕</div>
            </div>
            <div id="content_arms"></div>
        </div>

        <!-- Плавающее окно для Ног -->
        <div class="floating-panel" id="panel_legs">
            <div class="panel-header-drag" onmousedown="startDrag(event, 'panel_legs')">
                <div class="panel-title">👖 Настройка ног</div>
                <div class="close-btn" onclick="closePanels()">✕</div>
            </div>
            <div id="content_legs"></div>
        </div>

        <!-- Стартовый нижний док -->
        <div class="start-dock" id="startDock" onclick="event.stopPropagation()">
            <div class="dock-group">
                <div class="dock-label">Основа кожи</div>
                <div class="dock-options" id="dock_skin"></div>
            </div>
            <div class="dock-group">
                <div class="dock-label">Освещение</div>
                <div class="dock-options" id="dock_lighting">
                    <button class="dock-btn active" onclick="setLighting(0, this)">Студия</button>
                    <button class="dock-btn" onclick="setLighting(1, this)">Ярко</button>
                    <button class="dock-btn" onclick="setLighting(2, this)">Мрак</button>
                </div>
            </div>
            <div class="dock-group">
                <div class="dock-label">Фон сцены</div>
                <div class="dock-options" id="dock_bg"></div>
            </div>
        </div>
    </div>

    <canvas id="hiddenCanvas" width="64" height="64"></canvas>

    <!-- Подключаем Three.js и Skinview3d -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "skinview3d": "https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/+esm"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as skinview3d from 'skinview3d';

        const layersConfig = [
            { id: 'skin', label: 'Основа', path: 'skinmake/skin', options: ['1', '2', '3'], category: 'base' },
            { id: 'eyes', label: 'Глаза', path: 'skinmake/head/eyes', options: ['none', '1', '2', '3'], category: 'head' },
            { id: 'nose', label: 'Нос', path: 'skinmake/head/nose', options: ['none', '1', '2'], category: 'head' },
            { id: 'mouth', label: 'Рот', path: 'skinmake/head/mouth', options: ['none', '1', '2'], category: 'head' },
            { id: 'mustache', label: 'Усы', path: 'skinmake/head/mustache', options: ['none', '1', '2'], category: 'head' },
            { id: 'hair', label: 'Прическа', path: 'skinmake/head/hair', options: ['none', '1', '2', '3'], category: 'head' },
            { id: 'jacket', label: 'Куртка', path: 'skinmake/body/jacket', options: ['none', '1', '2', '3'], category: 'body' },
            { id: 'background', label: 'Фон', path: 'skinmake/backgrounds', options: ['none', '1', '2', '3'], category: 'bg' }
        ];

        const state = {};
        let skinViewer = null;
        let raycaster, mouse;
        let hoveredPart = null;
        let activePart = null;

        // Плавное управление камерой и анимацией целей
        let targetCameraPos = new THREE.Vector3(0, 0, 45);
        let targetCameraTarget = new THREE.Vector3(0, 0, 0);

        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');

        function initViewer() {
            const container = document.getElementById('skin_container');
            skinViewer = new skinview3d.SkinViewer({
                canvas: container,
                width: container.clientWidth,
                height: container.clientHeight,
                skin: null
            });

            skinViewer.autoRotate = false;
            skinViewer.animation = new skinview3d.IdleAnimation();
            skinViewer.animation.speed = 0.5;
            skinViewer.globalLight.intensity = 1.3;
            skinViewer.cameraLight.intensity = 0.5;
            skinViewer.fov = 45;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            container.addEventListener('mousemove', onMouseMove);
            container.addEventListener('click', onModelClick);

            window.addEventListener('resize', () => {
                skinViewer.width = container.clientWidth;
                skinViewer.height = container.clientHeight;
            });
        }

        function initDefaults() {
            layersConfig.forEach(l => state[l.id] = l.options[0]);
            updateSkin();
            buildUI();
        }

        // Собираем элементы интерфейса в плавающие окна
        function buildUI() {
            // Заполняем стартовый док (основа кожи и фон)
            const skinDock = document.getElementById('dock_skin');
            skinDock.innerHTML = '';
            layersConfig.find(l => l.id === 'skin').options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `dock-btn ${state['skin'] === opt ? 'active' : ''}`;
                btn.innerText = `#${opt}`;
                btn.onclick = () => { state['skin'] = opt; updateSkin(); buildUI(); };
                skinDock.appendChild(btn);
            });

            const bgDock = document.getElementById('dock_bg');
            bgDock.innerHTML = '';
            layersConfig.find(l => l.id === 'background').options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `dock-btn ${state['background'] === opt ? 'active' : ''}`;
                btn.innerText = opt === 'none' ? 'Нет' : `#${opt}`;
                btn.onclick = () => { state['background'] = opt; updateBackground(); buildUI(); };
                bgDock.appendChild(btn);
            });

            // Заполняем панели категорий
            ['head', 'body', 'arms', 'legs'].forEach(cat => {
                const container = document.getElementById(`content_${cat}`);
                if (!container) return;
                container.innerHTML = '';

                const relevantLayers = layersConfig.filter(l => l.category === cat);
                if (relevantLayers.length === 0 && cat === 'arms') {
                    // Опции для рук или ног если понадобятся
                }

                relevantLayers.forEach(layer => {
                    const section = document.createElement('div');
                    section.style.marginBottom = '12px';
                    section.innerHTML = `<div style="font-size:0.7rem; font-weight:700; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase;">${layer.label}</div>`;
                    
                    const grid = document.createElement('div');
                    grid.className = 'options-grid';

                    layer.options.forEach(opt => {
                        const card = document.createElement('div');
                        const isSelected = state[layer.id] === opt;
                        card.className = `option-card ${isSelected ? 'selected' : ''}`;
                        card.onclick = (e) => {
                            e.stopPropagation();
                            state[layer.id] = opt;
                            updateSkin();
                            buildUI();
                        };

                        const cardCanvas = document.createElement('canvas');
                        cardCanvas.width = 48;
                        cardCanvas.height = 48;
                        drawCardPreview(layer, opt, cardCanvas);

                        const span = document.createElement('span');
                        span.innerText = opt === 'none' ? 'Нет' : `#${opt}`;

                        card.appendChild(cardCanvas);
                        card.appendChild(span);
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    container.appendChild(section);
                });
            });
        }

        // Точное определение пересечения мыши с 3D мешами персонажа
        function getIntersectedPart(event) {
            if (!skinViewer || !skinViewer.playerObject) return null;
            const rect = skinViewer.canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, skinViewer.camera);
            
            const meshes = [];
            skinViewer.playerObject.innerLayer.traverse(child => {
                if (child.isMesh) meshes.push(child);
            });
            skinViewer.playerObject.outerLayer.traverse(child => {
                if (child.isMesh) meshes.push(child);
            });

            const intersects = raycaster.intersectObjects(meshes, true);
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                // Определяем часть тела по имени или структуре parent
                let curr = obj;
                while (curr && curr !== skinViewer.playerObject) {
                    if (curr === skinViewer.playerObject.head) return 'head';
                    if (curr === skinViewer.playerObject.body) return 'body';
                    if (curr === skinViewer.playerObject.leftArm || curr === skinViewer.playerObject.rightArm) return 'arms';
                    if (curr === skinViewer.playerObject.leftLeg || curr === skinViewer.playerObject.rightLeg) return 'legs';
                    curr = curr.parent;
                }
            }
            return null;
        }

        function onMouseMove(event) {
            const part = getIntersectedPart(event);
            hoveredPart = part;

            // Мягкая подсветка (эмиссия/цвет материалов при наведении)
            highlightPart(hoveredPart);

            // Голова следит за курсором, если нет активного диалога и мышь в пределах канваса
            if (skinViewer && skinViewer.playerObject && !activePart) {
                const rect = skinViewer.canvas.getBoundingClientRect();
                const xNorm = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                const yNorm = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                skinViewer.playerObject.head.rotation.y = THREE.MathUtils.lerp(skinViewer.playerObject.head.rotation.y, xNorm * 0.5, 0.1);
                skinViewer.playerObject.head.rotation.x = THREE.MathUtils.lerp(skinViewer.playerObject.head.rotation.x, -yNorm * 0.3, 0.1);
            }
        }

        function highlightPart(partName) {
            if (!skinViewer || !skinViewer.playerObject) return;
            
            const parts = {
                head: skinViewer.playerObject.head,
                body: skinViewer.playerObject.body,
                arms: [skinViewer.playerObject.leftArm, skinViewer.playerObject.rightArm],
                legs: [skinViewer.playerObject.leftLeg, skinViewer.playerObject.rightLeg]
            };

            // Сброс подсветки у всех
            skinViewer.playerObject.innerLayer.traverse(child => {
                if (child.material) child.material.emissive.setHex(0x000000);
            });
            skinViewer.playerObject.outerLayer.traverse(child => {
                if (child.material) child.material.emissive.setHex(0x000000);
            });

            // Подсветка нужной части мягким свечением
            if (partName && parts[partName]) {
                const list = Array.isArray(parts[partName]) ? parts[partName] : [parts[partName]];
                list.forEach(p => {
                    p.traverse(child => {
                        if (child.material) child.material.emissive.setHex(0x333366);
                    });
                });
            }
        }

        function onModelClick(event) {
            const part = getIntersectedPart(event);
            if (!part) return;

            activePart = part;
            closePanels();

            // Живая реакция персонажа: короткий кивок / поклон
            playLiveReaction();

            // Показываем плавающее окошко рядом с кликом / частью тела
            const panel = document.getElementById(`panel_${part}`);
            if (panel) {
                panel.classList.add('active');
                // Позиционируем окно рядом с курсором или в зоне клика
                const x = Math.min(event.clientX + 20, window.innerWidth - 340);
                const y = Math.min(event.clientY - 50, window.innerHeight - 380);
                panel.style.left = `${Math.max(20, x)}px`;
                panel.style.top = `${Math.max(80, y)}px`;
            }

            // Плавное приближение камеры к выбранной части тела
            focusCameraOnPart(part);
        }

        function playLiveReaction() {
            if (!skinViewer) return;
            const prevAnim = skinViewer.animation;
            // Аккуратная живая анимация кивка / понимания
            skinViewer.animation = new skinview3d.RunningAnimation();
            skinViewer.animation.speed = 1.2;
            setTimeout(() => {
                if (skinViewer) {
                    skinViewer.animation = new skinview3d.IdleAnimation();
                    skinViewer.animation.speed = 0.5;
                }
            }, 500);
        }

        function focusCameraOnPart(part) {
            if (part === 'head') {
                targetCameraPos.set(0, 10, 25);
                targetCameraTarget.set(0, 10, 0);
            } else if (part === 'body' || part === 'arms') {
                targetCameraPos.set(0, 0, 30);
                targetCameraTarget.set(0, 0, 0);
            } else if (part === 'legs') {
                targetCameraPos.set(0, -12, 30);
                targetCameraTarget.set(0, -10, 0);
            }
        }

        window.handleBackgroundClick = function(event) {
            closePanels();
            activePart = null;
            // Возврат камеры в стартовую позицию
            targetCameraPos.set(0, 0, 45);
            targetCameraTarget.set(0, 0, 0);
        }

        window.closePanels = function() {
            document.querySelectorAll('.floating-panel').forEach(p => p.classList.remove('active'));
        }

        // Перетаскивание окон за шапку
        let dragItem = null;
        let startX = 0, startY = 0;

        window.startDrag = function(e, panelId) {
            dragItem = document.getElementById(panelId);
            startX = e.clientX - dragItem.offsetLeft;
            startY = e.clientY - dragItem.offsetTop;
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        }

        function onDrag(e) {
            if (!dragItem) return;
            dragItem.style.left = `${e.clientX - startX}px`;
            dragItem.style.top = `${e.clientY - startY}px`;
        }

        function stopDrag() {
            dragItem = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        async function drawCardPreview(targetLayer, optionValue, targetCanvas) {
            const ctxCard = targetCanvas.getContext('2d');
            ctxCard.imageSmoothingEnabled = false;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 64;
            tempCanvas.height = 64;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.imageSmoothingEnabled = false;

            const activeRelevantLayers = layersConfig.filter(l => l.category !== 'bg');
            const imagePromises = activeRelevantLayers.map(l => {
                const val = (l.id === targetLayer.id) ? optionValue : state[l.id];
                if (val === 'none') return Promise.resolve(null);

                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${l.path}/${val}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) tempCtx.drawImage(img, 0, 0, 64, 64);
            });

            if (targetLayer.id === 'jacket') {
                ctxCard.drawImage(tempCanvas, 20, 20, 8, 12, 8, 8, 32, 32);
            } else {
                ctxCard.drawImage(tempCanvas, 8, 8, 8, 8, 0, 0, 48, 48);
                ctxCard.drawImage(tempCanvas, 40, 8, 8, 8, 0, 0, 48, 48);
            }
        }

        window.updateBackground = function() {
            const workspace = document.getElementById('workspace');
            const bgVal = state['background'];
            workspace.style.backgroundImage = bgVal === 'none' ? 'none' : `url('skinmake/backgrounds/${bgVal}.png')`;
        }

        window.setLighting = function(presetIndex, btnElement) {
            document.querySelectorAll('#dock_lighting .dock-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            if (!skinViewer) return;
            if (presetIndex === 0) {
                skinViewer.globalLight.intensity = 1.3;
                skinViewer.cameraLight.intensity = 0.5;
            } else if (presetIndex === 1) {
                skinViewer.globalLight.intensity = 2.2;
                skinViewer.cameraLight.intensity = 1.0;
            } else if (presetIndex === 2) {
                skinViewer.globalLight.intensity = 0.5;
                skinViewer.cameraLight.intensity = 0.1;
            }
        }

        window.updateSkin = async function() {
            ctx.clearRect(0, 0, 64, 64);
            ctx.imageSmoothingEnabled = false;

            const relevantLayers = layersConfig.filter(l => l.category !== 'bg');
            const imagePromises = relevantLayers.map(layer => {
                const selectedOption = state[layer.id];
                if (selectedOption === 'none') return Promise.resolve(null);
                
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${layer.path}/${selectedOption}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) ctx.drawImage(img, 0, 0, 64, 64);
            });

            if (skinViewer) {
                skinViewer.loadSkin(hiddenCanvas.toDataURL());
            }
        }

        window.randomizeSkin = function() {
            layersConfig.forEach(layer => {
                if (layer.category !== 'bg') {
                    const randOpt = layer.options[Math.floor(Math.random() * layer.options.length)];
                    state[layer.id] = randOpt;
                }
            });
            updateSkin();
            buildUI();
        }

        window.downloadSkin = function() {
            const link = document.createElement('a');
            link.download = 'minecraft_custom_skin.png';
            link.href = hiddenCanvas.toDataURL('image/png');
            link.click();
        }

        // Плавный анимационный цикл для камеры и переходов
        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (skinViewer && skinViewer.camera && skinViewer.controls) {
                skinViewer.camera.position.lerp(targetCameraPos, 0.08);
                skinViewer.controls.target.lerp(targetCameraTarget, 0.08);
                skinViewer.controls.update();
            }
        }

        initViewer();
        initDefaults();
        animateLoop();
    </script>
</body>
</html>
