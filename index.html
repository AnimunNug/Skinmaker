<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Studio Pro</title>
    <style>
        :root {
            --bg-base: #09090b;
            --panel-bg: rgba(18, 18, 24, 0.9);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 64px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
        }

        .action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
        }
        .action-btn.primary:hover {
            background: var(--accent-hover);
        }

        .workspace {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #050507;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            transition: background-image 0.4s ease;
        }

        #skin_container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #skin_container:active {
            cursor: grabbing;
        }

        /* Плавающие перетаскиваемые окна */
        .floating-window {
            position: absolute;
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 40;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .window-header {
            height: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            cursor: move;
        }

        .window-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .window-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 380px;
            overflow-y: auto;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .option-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-card:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.2);
        }

        .option-card.selected {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.15);
        }

        .option-card canvas {
            width: 48px;
            height: 48px;
            background: #09090b;
            border-radius: 6px;
            image-rendering: pixelated;
        }

        .option-card span {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .option-card.selected span {
            color: var(--text-main);
        }

        /* Нижняя панель глобальных настроек (стартовая позиция) */
        .global-dock {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            padding: 12px 24px;
            border-radius: 16px;
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 30;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .dock-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dock-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .dock-options {
            display: flex;
            gap: 6px;
        }

        .dock-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dock-btn:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
        }

        .dock-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .divider {
            width: 1px;
            height: 32px;
            background: var(--panel-border);
        }

        #hiddenCanvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">✨</div>
            <span>MINECRAFT SKIN STUDIO</span>
        </div>
        <div class="header-actions">
            <button class="action-btn" onclick="randomizeSkin()">🎲 Случайно</button>
            <button class="action-btn primary" onclick="downloadSkin()">📥 Скачать скин</button>
        </div>
    </header>

    <div class="workspace" id="workspace" onclick="handleBackgroundClick(event)">
        <canvas id="skin_container"></canvas>

        <!-- Глобальная док-панель (Стартовая позиция) -->
        <div class="global-dock" onclick="event.stopPropagation()">
            <div class="dock-group">
                <span class="dock-label">Основа кожи</span>
                <div class="dock-options" id="skinBaseOptions"></div>
            </div>
            <div class="divider"></div>
            <div class="dock-group">
                <span class="dock-label">Фон сцены</span>
                <div class="dock-options" id="bgOptions"></div>
            </div>
            <div class="divider"></div>
            <div class="dock-group">
                <span class="dock-label">Освещение</span>
                <div class="dock-options" id="lightOptions"></div>
            </div>
        </div>

        <!-- Динамическое всплывающее окно будет создаваться здесь -->
        <div id="popupContainer"></div>
    </div>

    <canvas id="hiddenCanvas" width="64" height="64"></canvas>

    <!-- Подключаем Three.js и Skinview3d -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "skinview3d": "https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/+esm"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as skinview3d from 'skinview3d';

        const layersConfig = [
            { id: 'skin', label: 'Основа кожи', path: 'skinmake/skin', options: ['1', '2', '3'] },
            { id: 'eyes', label: 'Глаза', path: 'skinmake/head/eyes', options: ['none', '1', '2', '3'], part: 'head' },
            { id: 'nose', label: 'Нос', path: 'skinmake/head/nose', options: ['none', '1', '2'], part: 'head' },
            { id: 'mouth', label: 'Рот', path: 'skinmake/head/mouth', options: ['none', '1', '2'], part: 'head' },
            { id: 'mustache', label: 'Усы', path: 'skinmake/head/mustache', options: ['none', '1', '2'], part: 'head' },
            { id: 'hair', label: 'Прическа', path: 'skinmake/head/hair', options: ['none', '1', '2', '3'], part: 'head' },
            { id: 'jacket', label: 'Куртка / Одежда', path: 'skinmake/body/jacket', options: ['none', '1', '2', '3'], part: 'body' },
            { id: 'background', label: 'Фон', path: 'skinmake/backgrounds', options: ['none', '1', '2', '3'], isBackground: true },
            { id: 'lighting', label: 'Свет', options: ['Студийный', 'Яркий', 'Мрачный'], isLighting: true }
        ];

        const state = {};
        let skinViewer = null;
        let hoveredPart = null;
        let activePopupPart = null;

        // Плавная камера и анимация
        let cameraTargetPos = new THREE.Vector3(0, 0, 45);
        let cameraLookAtTarget = new THREE.Vector3(0, -2, 0);
        let currentFov = 45;

        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');

        function initViewer() {
            const container = document.getElementById('skin_container');
            skinViewer = new skinview3d.SkinViewer({
                canvas: container,
                width: container.clientWidth,
                height: container.clientHeight,
                skin: null
            });

            skinViewer.autoRotate = false;
            skinViewer.animation = new skinview3d.IdleAnimation();
            skinViewer.animation.speed = 0.5;
            skinViewer.globalLight.intensity = 1.3;
            skinViewer.cameraLight.intensity = 0.5;
            skinViewer.fov = currentFov;

            // Настройка луча для точного 3D детекта частей тела
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, skinViewer.camera);
                const intersects = raycaster.intersectObjects(skinViewer.scene.children, true);

                let foundPart = null;
                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj && obj !== skinViewer.scene) {
                        if (obj === skinViewer.playerObject.head) { foundPart = 'head'; break; }
                        if (obj === skinViewer.playerObject.body || obj === skinViewer.playerObject.jacket) { foundPart = 'body'; break; }
                        if (obj === skinViewer.playerObject.leftArm || obj === skinViewer.playerObject.rightArm || obj === skinViewer.playerObject.leftSleeve || obj === skinViewer.playerObject.rightSleeve) { foundPart = 'arms'; break; }
                        if (obj === skinViewer.playerObject.leftLeg || obj === skinViewer.playerObject.rightLeg || obj === skinViewer.playerObject.leftPants || obj === skinViewer.playerObject.rightPants) { foundPart = 'legs'; break; }
                        obj = obj.parent;
                    }
                }

                hoveredPart = foundPart;
                container.style.cursor = foundPart ? 'pointer' : 'grab';

                // Голова следит за курсором когда нет активного попапа и в режиме ожидания
                if (skinViewer.playerObject && !activePopupPart) {
                    const xNorm = (e.clientX / window.innerWidth) * 2 - 1;
                    const yNorm = -(e.clientY / window.innerHeight) * 2 + 1;
                    skinViewer.playerObject.head.rotation.y = THREE.MathUtils.lerp(skinViewer.playerObject.head.rotation.y, xNorm * 0.5, 0.1);
                    skinViewer.playerObject.head.rotation.x = THREE.MathUtils.lerp(skinViewer.playerObject.head.rotation.x, -yNorm * 0.3, 0.1);
                }
            });

            container.addEventListener('click', (e) => {
                if (hoveredPart) {
                    openPopupForPart(hoveredPart, e.clientX, e.clientY);
                    triggerLiveReaction();
                } else {
                    closeAllPopups();
                }
            });

            // Рендер-луп для плавной интерполяции камеры
            skinViewer.renderer.setAnimationLoop(() => {
                skinViewer.camera.position.lerp(cameraTargetPos, 0.08);
                skinViewer.camera.lookAt(cameraLookAtTarget);
                skinViewer.render();
            });

            window.addEventListener('resize', () => {
                skinViewer.width = container.clientWidth;
                skinViewer.height = container.clientHeight;
            });
        }

        function initDock() {
            // Заполнение док-панели (стартовая позиция)
            const skinDiv = document.getElementById('skinBaseOptions');
            const bgDiv = document.getElementById('bgOptions');
            const lightDiv = document.getElementById('lightOptions');

            layersConfig.find(l => l.id === 'skin').options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `dock-btn ${state['skin'] === opt ? 'active' : ''}`;
                btn.innerText = `#${opt}`;
                btn.onclick = () => { state['skin'] = opt; updateSkin(); initDock(); };
                skinDiv.appendChild(btn);
            });

            layersConfig.find(l => l.id === 'background').options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `dock-btn ${state['background'] === opt ? 'active' : ''}`;
                btn.innerText = opt === 'none' ? 'Нет' : `#${opt}`;
                btn.onclick = () => { state['background'] = opt; updateBackground(); initDock(); };
                bgDiv.appendChild(btn);
            });

            layersConfig.find(l => l.id === 'lighting').options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `dock-btn ${state['lighting'] === opt ? 'active' : ''}`;
                btn.innerText = opt;
                btn.onclick = () => { state['lighting'] = opt; updateLighting(opt); initDock(); };
                lightDiv.appendChild(btn);
            });
        }

        // Живая реакция при клике (аккуратный кивок/поворот вместо резкой анимации)
        function triggerLiveReaction() {
            if (!skinViewer) return;
            const prevAnim = skinViewer.animation;
            skinViewer.animation = new skinview3d.RunningAnimation();
            skinViewer.animation.speed = 1.2;
            setTimeout(() => {
                if (skinViewer) {
                    skinViewer.animation = prevAnim;
                    skinViewer.animation.speed = 0.5;
                }
            }, 500);
        }

        // Открытие плавающего окна рядом с выбранной частью тела
        window.openPopupForPart = function(partName, clientX, clientY) {
            closeAllPopups();
            activePopupPart = partName;

            // Чуть приближаем камеру к выбранной части
            if (partName === 'head') {
                cameraTargetPos.set(0, 8, 25);
                cameraLookAtTarget.set(0, 6, 0);
            } else if (partName === 'body' || partName === 'arms') {
                cameraTargetPos.set(0, 0, 32);
                cameraLookAtTarget.set(0, -2, 0);
            } else {
                cameraTargetPos.set(0, -10, 35);
                cameraLookAtTarget.set(0, -6, 0);
            }

            const popup = document.createElement('div');
            popup.className = 'floating-window';
            popup.id = 'activePopup';

            // Позиционируем окно рядом с курсором, но не выходя за пределы экрана
            let posX = clientX + 20;
            let posY = clientY - 50;
            if (posX + 320 > window.innerWidth) posX = window.innerWidth - 340;
            if (posY + 300 > window.innerHeight) posY = window.innerHeight - 320;
            if (posY < 70) posY = 70;

            popup.style.left = `${posX}px`;
            popup.style.top = `${posY}px`;

            let titleText = partName === 'head' ? '👤 Настройка головы' : (partName === 'body' ? '👕 Настройка одежды' : '👖 Элементы');
            let relevantLayers = layersConfig.filter(l => l.part === partName);

            let contentHTML = `
                <div class="window-header" id="popupHeader">
                    <span class="window-title">${titleText}</span>
                    <button class="close-btn" onclick="closeAllPopups()">✕</button>
                </div>
                <div class="window-body">
            `;

            relevantLayers.forEach(layer => {
                contentHTML += `<div style="font-size:0.7rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">${layer.label}</div>`;
                contentHTML += `<div class="options-grid">`;
                layer.options.forEach(opt => {
                    const isSelected = state[layer.id] === opt;
                    contentHTML += `
                        <div class="option-card ${isSelected ? 'selected' : ''}" onclick="selectOption('${layer.id}', '${opt}')">
                            <canvas id="prev_${layer.id}_${opt}" width="48" height="48"></canvas>
                            <span>${opt === 'none' ? 'Нет' : `#${opt}`}</span>
                        </div>
                    `;
                });
                contentHTML += `</div>`;
            });

            contentHTML += `</div>`;
            popup.innerHTML = contentHTML;
            document.getElementById('popupContainer').appendChild(popup);

            // Рендерим превью для карточек в окне
            relevantLayers.forEach(layer => {
                layer.options.forEach(opt => {
                    const canvas = document.getElementById(`prev_${layer.id}_${opt}`);
                    if (canvas) drawCardPreview(layer, opt, canvas);
                });
            });

            // Делаем окно перетаскиваемым за шапку
            makeDraggable(popup, document.getElementById('popupHeader'));
        }

        window.makeDraggable = function(elmnt, header) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            header.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        window.closeAllPopups = function() {
            document.getElementById('popupContainer').innerHTML = '';
            activePopupPart = null;
            // Возвращаем камеру в исходную позицию
            cameraTargetPos.set(0, 0, 45);
            cameraLookAtTarget.set(0, -2, 0);
        }

        window.selectOption = function(layerId, optionValue) {
            state[layerId] = optionValue;
            updateSkin();
            if (activePopupPart) {
                // Переоткрываем чтобы обновить выделение
                const popup = document.getElementById('activePopup');
                const x = popup ? popup.offsetLeft : window.innerWidth / 2;
                const y = popup ? popup.offsetTop : window.innerHeight / 2;
                openPopupForPart(activePopupPart, x, y);
            }
        }

        async function drawCardPreview(targetLayer, optionValue, targetCanvas) {
            const ctxCard = targetCanvas.getContext('2d');
            ctxCard.imageSmoothingEnabled = false;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 64;
            tempCanvas.height = 64;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.imageSmoothingEnabled = false;

            const activeRelevantLayers = layersConfig.filter(l => !l.isBackground && !l.isLighting);
            const imagePromises = activeRelevantLayers.map(l => {
                const val = (l.id === targetLayer.id) ? optionValue : state[l.id];
                if (val === 'none') return Promise.resolve(null);

                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${l.path}/${val}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) tempCtx.drawImage(img, 0, 0, 64, 64);
            });

            if (targetLayer.id === 'jacket') {
                ctxCard.drawImage(tempCanvas, 20, 20, 8, 12, 4, 4, 40, 40);
            } else {
                ctxCard.drawImage(tempCanvas, 8, 8, 8, 8, 0, 0, 48, 48);
            }
        }

        window.updateBackground = function() {
            const workspace = document.getElementById('workspace');
            const bgVal = state['background'];
            if (bgVal === 'none') {
                workspace.style.backgroundImage = 'none';
            } else {
                workspace.style.backgroundImage = `url('skinmake/backgrounds/${bgVal}.png')`;
            }
        }

        window.updateLighting = function(presetName) {
            if (!skinViewer) return;
            if (presetName === 'Студийный') {
                skinViewer.globalLight.intensity = 1.3;
                skinViewer.cameraLight.intensity = 0.5;
            } else if (presetName === 'Яркий') {
                skinViewer.globalLight.intensity = 2.2;
                skinViewer.cameraLight.intensity = 1.0;
            } else if (presetName === 'Мрачный') {
                skinViewer.globalLight.intensity = 0.5;
                skinViewer.cameraLight.intensity = 0.1;
            }
        }

        window.updateSkin = async function() {
            ctx.clearRect(0, 0, 64, 64);
            ctx.imageSmoothingEnabled = false;

            const relevantLayers = layersConfig.filter(l => !l.isBackground && !l.isLighting);
            const imagePromises = relevantLayers.map(layer => {
                const selectedOption = state[layer.id];
                if (selectedOption === 'none') return Promise.resolve(null);
                
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = `${layer.path}/${selectedOption}.png`;
                });
            });

            const loadedImages = await Promise.all(imagePromises);
            loadedImages.forEach(img => {
                if (img) ctx.drawImage(img, 0, 0, 64, 64);
            });

            if (skinViewer) {
                skinViewer.loadSkin(hiddenCanvas.toDataURL());
            }
        }

        window.handleBackgroundClick = function(event) {
            closeAllPopups();
        }

        window.randomizeSkin = function() {
            layersConfig.forEach(layer => {
                if (!layer.isBackground && !layer.isLighting) {
                    const randomIndex = Math.floor(Math.random() * layer.options.length);
                    state[layer.id] = layer.options[randomIndex];
                }
            });
            updateSkin();
            initDock();
        }

        window.downloadSkin = function() {
            const link = document.createElement('a');
            link.download = 'minecraft_custom_skin.png';
            link.href = hiddenCanvas.toDataURL('image/png');
            link.click();
        }

        // Инициализация дефолтных значений
        layersConfig.forEach(layer => {
            state[layer.id] = layer.options[0];
        });

        initViewer();
        initDock();
        updateSkin();
    </script>
</body>
</html>
